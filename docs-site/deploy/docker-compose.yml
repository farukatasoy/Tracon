# The documentation site, served on the droplet that already runs Traefik.
#
# Traefik v2.11 owns :80 and :443 and routes by Docker label, so this is not an
# nginx or Caddy virtual host on the host itself — it is a container that Traefik
# discovers. The labels copy the convention the other service on this host uses:
# the shared external `reverse-proxy` network, the `websecure` entrypoint, and the
# `le` certificate resolver, which obtains and renews the certificate over HTTP-01.
#
# The apex host is a different container and is not touched by anything here.
#
# SITE_HOST comes from .env, which scripts/site-deploy.sh writes from
# docs-site/site.config.mjs. It is not committed: a literal here would be one more
# copy of the address for nothing to keep in agreement.
name: tracon-site

services:
  site:
    image: nginx:1.27-alpine
    container_name: tracon-site
    restart: unless-stopped

    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must match site.config.mjs}
      NGINX_ENVSUBST_FILTER: SITE_HOST

    volumes:
      # Read-only on purpose: the site is delivered by rsync, never written from
      # inside the container.
      - /var/www/tracon:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro

    networks:
      - reverse-proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"

      # Apex serves the site.
      - "traefik.http.routers.tracon.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.tracon.entrypoints=websecure"
      - "traefik.http.routers.tracon.tls=true"
      - "traefik.http.routers.tracon.tls.certresolver=le"
      - "traefik.http.routers.tracon.service=tracon"

      # www is not a second home for the content: it redirects to the apex so
      # there is one canonical address. The router still needs its own
      # certresolver, or the certificate would not cover the www name and the
      # handshake fails before any redirect can happen.
      - "traefik.http.routers.tracon-www.rule=Host(`www.${SITE_HOST}`)"
      - "traefik.http.routers.tracon-www.entrypoints=websecure"
      - "traefik.http.routers.tracon-www.tls=true"
      - "traefik.http.routers.tracon-www.tls.certresolver=le"
      - "traefik.http.routers.tracon-www.service=tracon"
      - "traefik.http.routers.tracon-www.middlewares=tracon-www-to-apex"
      # $$ is a literal $ after compose interpolation: a single $ would let
      # compose eat the capture group and send the reader to https:// itself.
      - "traefik.http.middlewares.tracon-www-to-apex.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.tracon-www-to-apex.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.tracon-www-to-apex.redirectregex.permanent=true"

      # Named explicitly on both routers: with two routers on one container
      # Traefik's automatic service assignment is ambiguous.
      - "traefik.http.services.tracon.loadbalancer.server.port=8080"

networks:
  reverse-proxy:
    external: true
