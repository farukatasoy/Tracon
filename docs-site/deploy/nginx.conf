# Serves the built site behind Traefik, which terminates TLS and forwards here.
#
# Replaces nginx:alpine's stock conf.d/default.conf. Port 8080 rather than 80 to
# match the convention the other services on this host already use.

# The official nginx image substitutes SITE_HOST at container startup. A copy
# served on a preview hostname must expose noindex, including non-HTML assets.
map $host $seo_robots {
    default "noindex";
    "${SITE_HOST}" "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Traefik. Relative redirects preserve the public scheme/port.
    absolute_redirect off;

    # llms.txt and llms-full.txt are served as text/plain and are UTF-8. Without
    # this nginx sends no charset and a reader gets mojibake for anything non-ASCII.
    charset utf-8;
    # text/html is in charset_types implicitly and listing it warns at startup, so
    # this restates nginx's default set with text/markdown added - without it the
    # markdown copies go out with no charset at all.
    charset_types text/xml text/plain text/markdown text/vnd.wap.wml application/javascript application/rss+xml;
    add_header X-Robots-Tag $seo_robots always;

    # The site sets trailingSlash: 'always', so every page is written as
    # <route>/index.html. The $uri.html arm covers the few files emitted flat, and
    # =404 stops a miss from silently falling through to the landing page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Every page also publishes its markdown source next to it, and nginx's stock
    # mime.types has no entry for .md: without this the copy leaves as
    # application/octet-stream, which is a download prompt in a browser and an
    # unreadable body for a fetcher that trusts the Content-Type. `default_type`
    # rather than a server-level `types` block on purpose - a `types` block here
    # REPLACES the whole inherited map, which would take text/css and image/png
    # down with it. text/markdown is the type RFC 7763 registers.
    #
    # This block declares no add_header of its own, so it inherits the X-Robots-Tag
    # above; adding one here would drop that inheritance and leave a preview host
    # serving indexable markdown.
    location ~ \.md$ {
        default_type text/markdown;
    }

    # Astro fingerprints everything under /_astro/, so the name changes whenever the
    # content does and the file can be cached indefinitely.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $seo_robots always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml;

    access_log off;
}
