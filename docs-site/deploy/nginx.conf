# Serves the built site behind Traefik, which terminates TLS and forwards here.
#
# Replaces nginx:alpine's stock conf.d/default.conf. Port 8080 rather than 80 to
# match the convention the other services on this host already use.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # llms.txt and llms-full.txt are served as text/plain and are UTF-8. Without
    # this nginx sends no charset and a reader gets mojibake for anything non-ASCII.
    charset utf-8;

    # The site sets trailingSlash: 'always', so every page is written as
    # <route>/index.html. The $uri.html arm covers the few files emitted flat, and
    # =404 stops a miss from silently falling through to the landing page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro fingerprints everything under /_astro/, so the name changes whenever the
    # content does and the file can be cached indefinitely.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log off;
}
