<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>Tracon</title>
    <!--
      The Tracon mark, inline so the console asks for nothing before it paints.
      It is the same drawing as src/assets/tracon-mark.svg; the two are small
      enough that a shared file would cost a request to save nothing.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101c20'/%3E%3Cg fill='none' stroke='%2373d9c2' stroke-width='1.6'%3E%3Cpath d='M26 16A10 10 0 1 1 16 6'/%3E%3Cpath d='M21.5 16A5.5 5.5 0 1 1 16 10.5'/%3E%3Cpath d='M16 16 25 7' stroke-linecap='round'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2' fill='%23eef5f2'/%3E%3Ccircle cx='25' cy='7' r='2' fill='%2373d9c2'/%3E%3C/svg%3E"
    />
    <!--
      The ground colour, before the stylesheet arrives. Without it a cold load
      flashes the browser's white.

      🚨 The two colours are `--tracon-bg` for each theme, copied here because a
      stylesheet cannot paint before it is fetched. `scripts/check-tokens.mjs`
      compares them against `styles.css` and fails the build when they drift.
    -->
    <style>
      html {
        background-color: #0a1113;
      }

      html[data-theme='light'] {
        background-color: #eef2ec;
      }
    </style>
    <!--
      🚨 Runs BEFORE the stylesheet, so a stored preference paints its own
      ground rather than the default one. `theme.ts` is the source of truth and
      writes the same attribute at module load; this only moves that write
      earlier, and it stays silent if storage is unavailable.
    -->
    <script>
      try {
        var stored = window.localStorage.getItem('tracon.theme');
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : stored === 'system'
                ? 'light'
                : 'dark';
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
