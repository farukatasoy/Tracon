  # ---------------------------------------------------------------------------
  # Platform matrisi (2026-11-04) -- BU ISLER GITHUB'DA HENUZ KOSULMADI
  #
  # Sitedeki `reference/compatibility.md` platform tablosunun her satiri bir
  # bacakla kanitlanir. Bu bolumdeki bacaklarin KOMUTLARI yerelde kosuldu
  # (ayni ortam degiskenleri, ayni test projesi); isin kendisi -- YAML, runner,
  # sure siniri -- bir kez bile calismadi: gelistirme deposunda CI `skipped`
  # kalir ve kanonik depo okunamiyor. Ilk kosumdan sonra sure siniri olculenle
  # guncellenir ve bu uyari silinir.
  #
  # Kosul `build` ile ayni: yalniz kanonik repo. Her bacak `needs: build` tasir,
  # cunku depo korumasi yalniz `build`'de durur ve atlanan bir bagimlilik onlari
  # da atlatir; kapi testi bu zinciri zorunlu kilar. PR'de kosmaz (her PR on bacak
  # yakmasin), `main`, etiket ve elle tetiklemede kosar. Varsayilan imaj bacaklari
  # (`test-postgres`, `test-sqlserver`) PR'de de kosar ve bu matrislerin disindadir.
  #
  # Bacak = bir ortam degiskeni seti. Test sinifi degismez: `SqlServerFixture` ve
  # `PostgresFixture` degiskenleri okur; bos deger varsayilani korur. Bacaklar
  # `build` isinin tar'ini kullanir; derlemez.
  # ---------------------------------------------------------------------------
  sqlserver-matrix:
    name: SQL Server (${{ matrix.name }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Tahmin ~9,5 dk (eski seri kosumda modul 361 sn; yerelde olculen en uzun
    # kosum 14 dk, amd64 emulasyonunda). Runner olcumu yok.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # En dusuk sunucu surumu: `src/Tracon.SqlServer/README.md` 2019+ der.
          - name: '2019'
            image: mcr.microsoft.com/mssql/server:2019-latest
            collation: ''
            lcid: ''
          # Turkce collation: `Turkish_CI_AS` ve `MSSQL_LCID=1055` BIRLIKTE verilir;
          # yalniz collation verilirse sunucu dili Ingilizce kalir ve havuzdan donen
          # baglanti sifirlanirken duser.
          - name: '2022, Turkish_CI_AS'
            image: mcr.microsoft.com/mssql/server:2022-latest
            collation: Turkish_CI_AS
            lcid: '1055'
    env:
      TRACON_TEST_SQLSERVER_IMAGE: ${{ matrix.image }}
      TRACON_TEST_SQLSERVER_COLLATION: ${{ matrix.collation }}
      TRACON_TEST_SQLSERVER_LCID: ${{ matrix.lcid }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derleme ciktilarini indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Derleme ciktilarini ac
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Bagimliliklari geri yukle
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Test et
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.SqlServer.IntegrationTests/Tracon.SqlServer.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sqlserver-${{ strategy.job-index }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

  postgres-matrix:
    name: PostgreSQL (${{ matrix.name }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Tahmin ~5,5 dk (eski seri kosumda modul 150 sn; yerelde olculen en uzun
    # kosum 7 dk, yuklu makine, 1594 test, imaj hazir). Runner olcumu yok.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '12'
            image: pgvector/pgvector:pg12
            icu: ''
          - name: '13'
            image: pgvector/pgvector:pg13
            icu: ''
          - name: '14'
            image: pgvector/pgvector:pg14
            icu: ''
          - name: '15'
            image: pgvector/pgvector:pg15
            icu: ''
          - name: '16'
            image: pgvector/pgvector:pg16
            icu: ''
          - name: '17'
            image: pgvector/pgvector:pg17
            icu: ''
          # Varsayilan imaj (18) Turkce ICU yerel ayariyla: `lower()` ve karsilastirma
          # davranisi bu bacakta degisir.
          - name: '18, ICU tr-TR'
            image: ''
            icu: tr-TR
    env:
      TRACON_TEST_POSTGRES_IMAGE: ${{ matrix.image }}
      TRACON_TEST_POSTGRES_ICU_LOCALE: ${{ matrix.icu }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derleme ciktilarini indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Derleme ciktilarini ac
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Bagimliliklari geri yukle
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Test et
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.PostgreSql.IntegrationTests/Tracon.PostgreSql.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-postgres-${{ strategy.job-index }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

  # SQLite surucusu yerel bir kutuphane tasir; surum o kutuphanenin surumudur.
  # Bacak, `Microsoft.Data.Sqlite`'in paketledigi kutuphanenin yerine ayni
  # ailenin (`SQLitePCLRaw.lib.e_sqlite3`) eski bir surumunu koyar ve ayni test
  # projesini kosar. `SqliteEngineVersionTests` motorun gercekten istenen surum
  # oldugunu dogrular: degistirme sessizce basarisiz olursa bacak kirmizidir.
  sqlite-floor:
    name: SQLite ${{ matrix.sqlite }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Tahmin ~5,5 dk (eski seri kosumda modul 91 sn). Yerelde 1,5 dk (macOS, sicak onbellek).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - native: '2.1.7'
            sqlite: '3.44.0'
    env:
      TRACON_TEST_SQLITE_VERSION: ${{ matrix.sqlite }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derleme ciktilarini indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Derleme ciktilarini ac
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Bagimliliklari geri yukle
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Yerel kutuphaneyi eski surumle degistir
        env:
          NATIVE_VERSION: ${{ matrix.native }}
        run: |
          # Repo'nun disinda: Directory.Packages.props (merkezi surum yonetimi) bu projeyi de bagliyor olurdu.
          mkdir -p "${RUNNER_TEMP}/sqlite-native"
          cat > "${RUNNER_TEMP}/sqlite-native/Fetch.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="SQLitePCLRaw.lib.e_sqlite3" Version="${NATIVE_VERSION}" /></ItemGroup>
          </Project>
          EOF
          dotnet restore "${RUNNER_TEMP}/sqlite-native/Fetch.csproj" --packages "${RUNNER_TEMP}/sqlite-native/packages"
          cp "${RUNNER_TEMP}/sqlite-native/packages/sqlitepclraw.lib.e_sqlite3/${NATIVE_VERSION}/runtimes/linux-x64/native/libe_sqlite3.so" \
            artifacts/bin/Tracon.Sqlite.IntegrationTests/release_net10.0/runtimes/linux-x64/native/libe_sqlite3.so

      - name: Test et
        run: dotnet test --project tests/Tracon.Sqlite.IntegrationTests/Tracon.Sqlite.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sqlite-floor
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

  # ---------------------------------------------------------------------------
  # Test olmayan kapilar. `build` isinden ayrildilar: derleme zincirini
  # geciktirmeden paralel kosarlar ve `release-dryrun` her birini bekler, yani
  # kirmizi bir kapi onceki gibi provayi ve yayini durdurur.
  # ---------------------------------------------------------------------------
  format:
    name: Kod bicimi (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Tahmin ~7 dk (eski seri kosumda ubuntu adimi 223 sn). Windows olcumu yok.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Eski adimin ortami korunur: biçim denetimi Node kurulu bir runner'da,
      # node_modules olmadan kosardi.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Bagimliliklari geri yukle
        run: dotnet restore Tracon.slnx

      - name: Kod bicimini dogrula
        # Bicim sapmasi build'i kirar. Duzeltmek icin: dotnet format Tracon.slnx
        run: dotnet format Tracon.slnx --verify-no-changes --no-restore

  # Tahsis kapisi yalniz dort sicak yoldan biri (veya bench/ kendisi)
  # degistiyse kosar - `kapi.py performans`'in kendi mantigi
  # (`performance_gate_triggered`) yeniden kullanilir, CI kendi diff
  # tabanini hesaplar (PR'de taban dal, push'ta onceki commit).
  #
  # 🚨 Bir ETIKET push'unda `github.event.before` KIRK SIFIRDIR - o commit
  # yoktur, diff hesaplanamaz. Eskiden bu, asagidaki "taban cozulemedi"
  # dalina duser ve kapiyi KAZARA kosulsuz tetiklerdi. Sonuc olculdu
  # (2026-09-20): kapi 21 push boyunca `skipped` kaldi, ilk gercek kosumu
  # ilk `v*` etiketi oldu ve orada dustu - yani yalniz yayin yolunda kosan,
  # hic denenmemis bir kapiydi. Etiket artik ACIKCA ele alinir: etiketin
  # gosterdigi commit main'de zaten derlenip olculmustur, bu yuzden kapi
  # etikette kosmaz. Karari sifir SHA'nin yan etkisine birakmiyoruz.
  #
  # Kapi src'yi yeniden derler; bu yuzden `build` isinin calisma alaninda
  # degil, kendi isinde kosar.
  performans:
    name: Performans kapisi (tahsis)
    needs: build
    runs-on: ubuntu-latest
    # Tahmin ~2 dk tetiklenmediginde, ~8 dk tetiklendiginde (kapanis kapisinda ~220 sn).
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Performans kapisi sicak yolu degisti mi?
        id: perf-trigger
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            echo "etiket push'u - tahsis kapisi main'de olculdu, burada kosmaz"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            TRIGGERED=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import kapi; print('true' if kapi.performance_gate_triggered(kapi.changed_paths('$BASE') or []) else 'false')")
            echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"
          fi

      - name: Performans kapisi (tahsis)
        if: steps.perf-trigger.outputs.triggered == 'true'
        run: python3 scripts/kapi.py performans

  # Kapasite APARATININ kisa dogruluk kosumu - bir yuk olcumu
  # DEGIL. Uc HTTP yolu, iki kiraci, gercek TCP, gercek SQL ve packed
  # tuketici provenance'i kontrol edilir; hicbir sure esige baglanmaz
  # Agir profiller (sweep/arrival/workers/soak/nodes) CI'a GIRMEZ.
  #
  # Aparat kendi paketini uretir (izole feed, kendi surumu) ve src'yi yeniden
  # derler; bu yuzden `build` isinin calisma alaninda degil kendi isinde kosar.
  #
  # 🚨 Yalniz Linux: kendi PostgreSQL container'ini baslatir ve
  # `windows-latest` runner'i Linux image calistiramaz - ayni sebep
  # Tracon.no-docker.slnf'in var olma sebebi.
  #
  # 🚨 Eksik Docker veya hazirlanmamis paket SESSIZ SKIP degil BASARISIZ
  # onkosuldur: atlanmis bir provenance kontrolu CI log'unda gecmis bir
  # kontrolden ayirt edilemez.
  kapasite:
    name: Kapasite smoke (packed tuketici)
    needs: build
    runs-on: ubuntu-latest
    # Tahmin ~9 dk (kurulum 2 + pack 3 + smoke 2,4; onceki en uzun adim 4,2 dk,
    # pack olmadan). Runner olcumu yok.
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Aparatin pack'i arayuz varliklarini (TRACON0003) derler.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Kapasite smoke (packed tuketici)
        timeout-minutes: 20
        run: |
          python3 scripts/kapi.py kapasite \
            --profil smoke \
            --surum "0.0.0-ci.${{ github.run_number }}"

      - name: Kapasite smoke ciktisini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-smoke
          path: artifacts/capacity/**
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------------
  # Yayın provası
  #
  # Kendi `dotnet pack`'ini KOSMAZ. `build` isinin ubuntu bacaginin
  # paketledigi `nuget-packages` artifact'ini indirir ve `kapi.py yayin --kuru
  # --paket-dizini` ile dogrular: manifest SHA-256'lari, commit ve taban
  # esitligi, on surum siniri, paket icerik sozlesmesi, kirici degisiklik raporu
  # dis sample'lar ve AOT smoke. Dogrulanan kume SHA-256
  # manifest'iyle `nuget-verified` olarak yuklenir; `publish` YALNIZ onu iter.
  # Bayt esitligi her push'ta (PR dahil) sinanir - etiket yolunda yeni mantik
  # yoktur.
  #
  # Is, `build`'e ve PR'de de kosan HER test ve kapi isine baglidir: kirmizi bir
  # modul provayi ve dolayisiyla yayini durdurur. PR'de atlanan isler (matrisler,
  # kultur) buraya GIRMEZ - atlanan bir bagimlilik bu isi de atlatir ve prova her
  # push'ta (PR dahil) kosmalidir. O isler `publish`'in bagimliligidir.
  #
  # `--surum` GECILMEZ: bu is her push'ta (PR dahil) kosar ve o an bir etiket
  # olmayabilir. Zorlanmis bir surum yalniz INSANIN gercek etiketten ONCE
  # yerelde kostugu provada anlamlidir. Bir GERCEK `v*` etiketinde
  # MinVer'in kendi hesapladigi surum zaten hedeftir - zorlamaya gerek yoktur.
  # ---------------------------------------------------------------------------
  release-dryrun:
    name: Yayin provasi (kapi.py yayin --kuru --paket-dizini)
    runs-on: ubuntu-latest
    needs: [build, format, performans, kapasite, test-fast, test-aspnetcore, test-sqlite, test-twonode, test-package, test-postgres, test-sqlserver, test-windows-sqlite, test-windows-core, test-windows-web]
    # Olculen en uzun 5,7 dk (kendi pack'iyle). Pack artik
    # bu iste degil; sinir ilk yeni kosumda yeniden olculur.
    timeout-minutes: 10

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Yalniz `npm publish --dry-run` icin (kapi.py'nin npm adimi). Bu is
      # paketlemez; arayuz varliklari (TRACON0003) `build` isinde gerekir.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/tracon-client/package-lock.json

      # `npm publish --dry-run`'in kendi `prepublishOnly` -> `npm run build`
      # adimi icin gerekir; kapi.py'nin npm adimi bu dizinde kosar.
      - name: TypeScript istemcisi bagimliliklari
        working-directory: packages/tracon-client
        run: npm ci

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # `artifacts/` .gitignore'dadir: indirilen dizin erken git denetimini
      # kirletmez (WorkflowWorkspacePathsTests).
      - name: Paketleri indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: artifacts/ci-paket

      - name: Yayin provasi
        run: python3 scripts/kapi.py yayin --kuru --paket-dizini artifacts/ci-paket

      - name: Dogrulanan paketleri yukle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-verified
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
            artifacts/package/release/package-manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # `npm-publish`'ten SONRA kosar. Iki kanal PARALEL kostugu surece
  # npm tarafi kirilirsa 20 NuGet paketi KALICI olarak yayinlanmis olur ve
  # sevk edilen dokuman (`docs-site` -> `npm install @tracon/client`) var
  # olmayan bir paketi tarif eder. NuGet'te geri donus yoktur; npm'in kisitli
  # bir unpublish penceresi vardir -- bu yuzden ucuz olan kanal ONCE basar ve
  # basarisiz olursa NuGet HIC basmaz. `npm-publish` var olan surumu atlar,
  # yani ayni etiket yeniden itildiginde bu bagimlilik zinciri KIRMAZ.
  #
  # `publish` AYNI kosumdaki HER test isine ve matris bacagina dogrudan baglidir
  # (kapi: `dokuman-bakim.py` tek derleme zinciri): kirmizi bir modul, bir
  # veritabani surumu ya da bir kultur bacagi, hangi isin icinde olursa olsun,
  # nuget.org'a yazmayi durdurur. `site` bu listede YOKTUR: etikette kosmaz ve
  # atlanan bir bagimlilik `publish`'i de atlatirdi.
  # ---------------------------------------------------------------------------
  publish:
    name: NuGet.org'a yayinla
    runs-on: ubuntu-latest
    needs: [release-dryrun, npm-publish, test-fast, test-aspnetcore, test-sqlite, test-twonode, test-package, test-postgres, test-sqlserver, test-windows-sqlite, test-windows-core, test-windows-web, postgres-matrix, sqlserver-matrix, sqlite-floor, culture-matrix]
    # Olculen en uzun 0,5 dk; taban 10 dk. Sinir push'un ortasinda keserse bir
    # kisim paket yayinda kalir; `--skip-duplicate` isi yeniden kosmayi guvenli yapar.
    # Checkout + Python + dogrulama eklendi (her biri saniyeler).
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Yalnizca 'v' ile baslayan etiketlerde calisir. Ornek: v1.0.0-preview.1
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget

    # Bu is DERLEMEZ ve PAKETLEMEZ. `release-dryrun`'in dogruladigi
    # `nuget-verified` kumesini indirir, provanin kullandigi AYNI komutla
    # (`kapi.py paket-dogrula`) yeniden sinar ve tam o baytlari iter.
    # Dogrulama login'den ONCE kosar: repo kodu calisirken API anahtari yoktur.
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # 🚨 `artifacts/` altina: repo izlenen `packages/tracon-client/`'i
      # tasir; eski indirme yolu `packages` checkout'la cakisirdi.
      - name: Paketleri indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-verified
          path: artifacts/nuget-verified

      - name: Paketleri dogrula
        run: python3 scripts/kapi.py paket-dogrula artifacts/nuget-verified

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet.org'a OIDC ile gir
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # 🚨 The nuget.org PROFILE NAME of the person who CREATED the policy,
          # not the owner it applies to, and not an email. These are different
          # things and the previous value confused them: the policy is OWNED by
          # the Tracon organization, so `Tracon` looked like the right answer and
          # the comment here even argued for it. Measured 2026-09-20 on the first
          # tag that reached this step:
          #
          #   Token exchange failed (HTTP 401) ... Make sure you are using the
          #   username of the policy creator, not the policy owner: No matching
          #   trust policy owned by user 'Tracon' was found.
          #
          # nuget.org's own documentation says the same in fewer words: this is
          # "your nuget.org username (profile name)" - the account that signs in
          # and holds the policy. Policy OWNERSHIP (an individual or an org) only
          # decides which packages the policy may publish; it never changes who
          # exchanges the token.
          user: farukatasoy

      - name: Yayinla
        run: >
          dotnet nuget push "artifacts/nuget-verified/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # ---------------------------------------------------------------------------
  # @tracon/client -> npm.org
  #
  # NuGet yayiniyla AYNI 'v*' etiketinde tetiklenir ve surumu AYNI etiketten
  # turetir -- iki kanal boylece YAPISAL olarak eslesir, ayri bir surum dosyasi
  # yoktur. Bu is `publish`'ten ONCE kosar ve `publish` buna baglidir: geri donusu
  # olmayan kanal (NuGet) en son basar. Testler artik `build` icinde kosmaz; bu is
  # `release-dryrun` uzerinden PR'de de kosan her test isine, ayrica matris
  # bacaklarina baglidir: kirmizi bir bacak varken npm'e de yazilmaz, yoksa
  # surum yarim kalirdi (npm yayinlandi, NuGet durdu).
  # ---------------------------------------------------------------------------
  npm-publish:
    name: npm.org'a yayinla
    runs-on: ubuntu-latest
    needs: [build, release-dryrun, postgres-matrix, sqlserver-matrix, sqlite-floor, culture-matrix]
    # Olculen en uzun 0,3 dk; taban 10 dk. Yeniden kosum guvenlidir: var olan
    # surum atlanir ("Surum zaten yayinlanmis mi").
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/tracon-client/package-lock.json

      - name: Bagimliliklari geri yukle
        working-directory: packages/tracon-client
        run: npm ci

      # MinVer.NET surumunu ayni etiketten turetir; npm'in boyle
      # bir mekanizmasi yoktur, o yuzden ayni etiketten elle turetilir.
      - name: Surumu etiketten turet
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: package.json surumunu yaz
        working-directory: packages/tracon-client
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      # `npm run generate` burada KOSMAZ -- src/schema.ts commit'lidir ve
      # `build` isindeki schema-drift testi onu zaten dogruladi. Yalniz derleme.
      - name: Paketle
        working-directory: packages/tracon-client
        run: npm run build

      # npm'de NuGet'in --skip-duplicate karsiligi yoktur; ayni surum ikinci kez
      # yayinlanirsa `npm publish` HATA ile durur. Var olan surum onceden
      # kontrol edilir; bulunursa yayinlama adimi ATLANIR, is KIRILMAZ.
      - name: Surum zaten yayinlanmis mi
        id: exists
        working-directory: packages/tracon-client
        run: |
          if npm view "@tracon/client@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "already published — atlaniyor"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # @tracon kapsamli bir paket varsayilan PRIVATE'tir; --access public
      # unutulursa paket yayinlanir ama kimse kuramaz (Kabul case 8).
      - name: Yayinla
        if: steps.exists.outputs.value == 'false'
        working-directory: packages/tracon-client
        run: |
          version="${{ steps.version.outputs.value }}"
          if [[ "$version" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Preview surumleri ciplak `npm install` ile sessizce kurulmamalidir --
      # ama npm `latest` etiketini SILDIRMEZ: DELETE .../dist-tags/latest 403
      # doner ve bir paketin ILK yayini, --tag ne olursa olsun, `latest`i o
      # surume baglar. Canlidaki latest=1.0.0-preview.1 boyle olustu ve
      # preview.2 yayininda `dist-tag rm` 403 ile isi kirdi. Bu yuzden hedef
      # "latest'i kaldirmak" degil, "latest'i en az zararli surume
      # baktirmak"tir:
      #   stable VARSA -> latest'e DOKUNULMAZ; preview yalniz `next` alir
      #   stable YOKSA -> latest en yeni preview'e alinir. Silemedigimize gore
      #                   eski bir preview'de takili kalmasi, duzeltmeleri
      #                   iceren yenisinden kotudur; kurulum metni yine `@next`
      #                   der ve ilk stable yayinda latest oraya gecer.
      # Adim yayin zaten varken de kosar; dist-tag'i duzeltir, immutable
      # package byte'larina dokunmaz. Yeniden kosulan ESKI bir etiket dist-tag'i
      # GERI ALMAMALIDIR, o yuzden once "daha yeni yayin var mi" sorulur.
      # Sinir: npm'in `>` araligi farkli major/minor/patch'in prerelease'lerini
      # gormez (`>1.0.0-preview.2` sorgusu 1.0.1-preview.1'i bulmaz), koruma o
      # kosede tam degildir.
      - name: Dagitim etiketini hizala
        working-directory: packages/tracon-client
        run: |
          version="${{ steps.version.outputs.value }}"
          if npm view "@tracon/client@>$version" version >/dev/null 2>&1; then
            echo "::notice::$version en yeni yayin degil -- dist-tag'lere dokunulmuyor"
            exit 0
          fi
          if [[ "$version" == *-* ]]; then
            npm dist-tag add "@tracon/client@$version" next
            stable="$(npm view @tracon/client versions --json 2>/dev/null \
              | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tail -n1 | tr -d '"' || true)"
            if [[ -z "$stable" ]]; then
              npm dist-tag add "@tracon/client@$version" latest
              echo "::notice::stable yayin yok -- latest $version'a alindi (npm latest'i sildirmez)"
            fi
          else
            npm dist-tag add "@tracon/client@$version" latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # GitHub release
  #
  # `publish` VE `npm-publish`'ten SONRA kosar: paket yayini bu ise bagli
  # KALMAZ, yalniz release sayfasi eksik kalir GitHub API erisilemezse.
  # Govde CHANGELOG.md'nin o surume ait bolumudur --
  # `scripts/changelog.py` kapi.py'nin surum-notu kapisiyla AYNI ayrıştırıcıdır,
  # iki ayri parser yazmak drift uretirdi. Surum bolumu yoksa `## [Unreleased]`
  # okunur: bolum ETIKET aninda yazilir, yani bu is kosarken heniz yazilmamis
  # olabilir. Iki taraf ayni fallback'i kullanmazsa prova yesil,
  # release govdesi bos olurdu.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub release olustur
    runs-on: ubuntu-latest
    needs: [publish, npm-publish]
    # Olculen en uzun 0,1 dk; taban 10 dk.
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # GitHub 125 000 karakterden uzun release govdesini reddeder (HTTP 422,
      # v1.0.0-preview.4); uzun notlar butun `###` gruplariyla kesilir ve
      # gerisi sitedeki tam nota baglanir (`changelog.github_release_body`).
      # Etiket adindan 'v' onekini dusurmek CHANGELOG basligindaki surumle
      # eslesir (`## [1.0.0-preview.1]`, `v` onceki degil). Etiket adi ortam
      # degiskeniyle tasinir - bir YAML ifadesini Python string literaline
      # gommek yerine (tag adinda `'` teorik olarak yasak degildir).
      - name: Surum notlarini CHANGELOG.md'den cikar
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os
          import pathlib
          import sys
          sys.path.insert(0, 'scripts')
          import changelog

          version = os.environ['TAG_NAME'].removeprefix('v')
          body, heading = changelog.read_release_notes(pathlib.Path('CHANGELOG.md'), version)
          if not body:
              sys.exit(f\"CHANGELOG.md has no '## [{version}]' and no '## [Unreleased]' section\")
          print(f'release notes read from: ## [{heading}]')
          release_body = changelog.github_release_body(body, version)
          if release_body != body:
              print(f'notes cut from {len(body)} to {len(release_body)} characters to fit a GitHub release')
          pathlib.Path('release-notes.md').write_text(release_body, encoding='utf-8')
          "

      # Ayni etiket yeniden itilirse is KIRILMAZ - npm-publish'in "already
      # published" deseniyle ayni fikir: var olan release atlanir.
      - name: Release zaten var mi
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already exists — atlaniyor"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub release olustur
        if: steps.exists.outputs.value == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"

  # ---------------------------------------------------------------------------
  # Dokuman sitesi (docs-site/) kapilari
  #
  # Bu is YAYINLAMAZ. Site kendi sunucumuzda barinir ve yayini
  # `scripts/site-deploy.sh` yapar -- ozel repo'da GitHub Pages ucretli plan
  # ister. Burada kalan sey, siteyi DERLEYIP kapilarini kosmaktir:
  # derlenmeyen bir site yayin gunune kadar sessiz kalmasin.
  #
  # Site AYRI bir yayin hattidir: `dotnet build`'e baglanmaz ve pakete girmez.
  # Yine de .NET derlemesine ihtiyac duyar -- API referansi DocFX ile derlenmis
  # assembly + XML dokumanindan uretilir (MSBuild devrede degil, K-4xx).
  # Arayuz varliklari gerekmez, bu yuzden TraconFrontendEnabled=false ile
  # npm/Vite adimlari atlanir.
  #
  # Ekran goruntuleri docs-site/public/screenshots altinda COMMIT'LIDIR; E2E
  # kosumundan uretilirler (DocumentationScreenshotTests). Bu is Playwright
  # calistirmaz.
  #
  # 🚨 Is PR'de KOSMAZ ve bu bilincli bir bosluktur: ozel repo'nun Actions
  # dakikasi sinirlidir ve `site-deploy.sh` dort kapiyi yayindan once zaten
  # kosar. Bir PR'i durdurmasi gereken kapi `build` isine konur -- oradaki
  # `check-content.mjs` adimi tam olarak bu sebeple oradadir.
  # ---------------------------------------------------------------------------
  site:
    name: Dokuman sitesi kapilari
    runs-on: ubuntu-latest
    needs: build
    # Olculen en uzun 7,9 dk.
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Astro 7.4 >= 22.22 ister; arayuzun jsdom 30'u ^22.22.2 ister.
      # Iki hat ayni surumu kullanir.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Assembly ve XML dokumanini uret
        run: |
          dotnet restore Tracon.slnx
          dotnet build Tracon.slnx -c Release --no-restore -p:TraconFrontendEnabled=false

      - name: DocFX aracini geri yukle
        run: dotnet tool restore

      - name: Site bagimliliklari
        working-directory: docs-site
        run: npm ci

      - name: Siteyi derle
        working-directory: docs-site
        run: npm run build

      # Uretilen sitede kirik ic baglanti olmamalidir. API referansi uid'lerden,
      # HTTP API sayfalari etiketlerden baglanti kurar; bir yeniden adlandirma
      # sessizce baglanti kirar.
      - name: Ic baglantilari denetle
        working-directory: docs-site
        run: npm run check:links

      # Sayfa agirligi taban cizgisi. Uretilen dist/ uzerinden olculur, bu yuzden
      # derlemeden SONRA kosar.
      - name: Sayfa agirligini denetle
        working-directory: docs-site
        run: npm run check:weight

      - name: Nginx SEO HTTP sözleşmesini denetle
        shell: bash
        run: |
          site_domain="$(node --input-type=module -e "import {site} from './docs-site/site.config.mjs'; process.stdout.write(new URL(site).hostname)")"
          docker run -d --rm --name tracon-seo -p 127.0.0.1:4175:8080 \
            -e SITE_HOST="$site_domain" -e NGINX_ENVSUBST_FILTER=SITE_HOST \
            -v "$PWD/docs-site/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/docs-site/deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine
          trap 'docker stop tracon-seo' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/site-http-denetle.py http://127.0.0.1:4175
