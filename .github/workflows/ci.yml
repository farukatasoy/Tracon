name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: true

jobs:
  build:
    name: Derle ve test et (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          # MinVer surumu git etiketlerinden uretir; tum gecmis gerekir.
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Bagimliliklari geri yukle
        run: dotnet restore AgentPrism.slnx

      - name: Kod bicimini dogrula
        # Bicim sapmasi build'i kirar. Duzeltmek icin: dotnet format AgentPrism.slnx
        run: dotnet format AgentPrism.slnx --verify-no-changes --no-restore

      - name: Derle
        run: dotnet build AgentPrism.slnx -c Release --no-restore

      - name: Test et
        # xunit.v3 Microsoft Testing Platform kullanir; rapor bayraklari VSTest'ten farklidir.
        # `--` sonrasi gelen argumanlar dogrudan test uygulamasina gecer.
        # TRX ciktisi test ikilisinin yanindaki TestResults klasorune yazilir.
        run: dotnet test AgentPrism.slnx -c Release --no-build -- --report-trx

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/**/TestResults/*.trx
          if-no-files-found: ignore

  pack:
    name: Paketle
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Paketleri uret
        run: |
          dotnet restore AgentPrism.slnx
          dotnet build AgentPrism.slnx -c Release --no-restore
          dotnet pack  AgentPrism.slnx -c Release --no-build

      - name: Paketleri yukle
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          if-no-files-found: error

  publish:
    name: NuGet.org'a yayinla
    runs-on: ubuntu-latest
    needs: pack
    # Yalnizca 'v' ile baslayan etiketlerde calisir. Ornek: v1.0.0-preview.1
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget

    steps:
      - name: Paketleri indir
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Yayinla
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
