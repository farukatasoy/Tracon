name: CI

# The mirror pushes every development commit to `next`, and this workflow decides on it there. `main` only moves by promotion:
# the mirror fast-forwards it to a commit of `next` whose run here passed, so `main` never carries a commit this workflow
# has not passed and a push to `main` starts no run. Pull requests still target `main`. A manual run (a release) is made on `main`.
on:
  push:
    branches: [next]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build, pack and rehearse (1.0.0-preview.N). Empty: an ordinary run."
        type: string
        default: ''
      publish:
        description: "Publish that version to npm and nuget.org. Needs the version, the main branch and the environment approvals."
        type: boolean
        default: false

permissions:
  contents: read

# A newer run of the same branch (or pull request) cancels the older one: the result of the
# older commit interests nobody and no runner minutes burn. A tag run is NEVER cancelled - the
# release page must not be left half written. The group of a manual trigger contains `run_id`, so
# runs triggered one after another (a release publish included) do not cancel each other. A
# cancelled run has no verdict (`remote_state` skips a cancelled run).
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: true
  # Python on a Windows runner decodes `sys.stdout` and `subprocess(text=True)` output with the
  # default code page (**cp1252**), which lacks some characters the scripts and their tests print
  # (for example the status marks and arrows in their output): the first `print` of such a
  # character raises `UnicodeEncodeError` and the gate goes red for a reason that has nothing to
  # do with the change. UTF-8 mode switches both decoders at once (measured: `getpreferredencoding`
  # also becomes `utf-8`), so it is wider than `PYTHONIOENCODING`. It sits at the workflow level
  # because the `unittest` run prints such text too - a fix inside one script could not cover
  # that step.
  PYTHONUTF8: 1

# ---------------------------------------------------------------------------
# Time limits (measured 2026-09-23). Every job carries `timeout-minutes`. Without a limit
# GitHub's default of 360 minutes applies: a hung test app burns two runners for six hours and
# the log does not say which app hung. A check fails any job that has no limit.
#
# Rule: limit = about twice the longest measured duration, rounded up to 5 min. Jobs under a
# minute get a floor of 10 min, so network latency in the setup steps does not produce a
# false red. Measurement: GitHub Actions API, 16 runs (2026-09-06..21), job and step
# durations. If a job passes half its limit, re-measure first, then raise it.
# `--max-parallel-test-modules 1` belongs only to the `--solution` run of the culture job
# (its modules run serially); every other test job runs one module with `--project` and does
# not carry that flag.
#
# A step limit exists only on the capacity step. Every test module is a separate step; if a
# module hangs, the job limit cuts the job and the log names the hung step. A step limit
# breaks only its own step: the following `if: always()` upload steps still run and the TRX
# of the finished test apps stays in the artifact. A job limit cancels the whole job.
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # Single build chain
  #
  # `build` compiles, packs and puts the compiled output tree into ONE tar file
  # (`bin-<os>`). Every test job downloads THIS run's tar through `needs: build`, unpacks it and
  # runs its modules with it; none of them compiles or packs. So the files a release pushes
  # and the binaries the tests ran come from one build. `publish` depends on every test job: a
  # red module stops the release, whichever job it sits in.
  #
  # A release is ONE manually triggered run of this workflow on `main`: it builds, tests,
  # rehearses and publishes, and the tag is placed afterwards on the commit the published
  # packages name. So a red run burns no version number, and the tag run that follows only writes
  # the GitHub release page (`build` does not run on a tag, and nothing that needs it does).
  #
  # Why a tar: `upload-artifact` zips a directory and loses the execute bit; the test binaries
  # (apphost, WorkerHarness) must be executable. The tar is already compressed, so the upload
  # uses `compression-level: 0`.
  #
  # Why `dotnet restore` in every test job: `dotnet test --no-build` needs `project.assets.json`
  # to evaluate the project. The tar carries only `artifacts/bin`; restoring from the NuGet
  # cache takes seconds and is cheaper and safer than carrying the build intermediates (obj).
  #
  # Job order is a queue hint: long jobs come first in the file. When the concurrent job limit
  # is exceeded, GitHub decides which job starts first.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # CI runs only in the canonical repository: forks and any other copy of the tree skip every
    # job. The condition lives ONLY here: every other job depends on `build` through `needs`
    # (directly or through a chain) and a skipped dependency skips them too. `release-dryrun`
    # must not carry an `if:` (it runs on every push), so it relies on this chain. A new job that
    # does not carry `needs: build` must carry the same condition itself. It is an allow list, so
    # forks do not run either. If the repository moves, update this line.
    #
    # A tag run does not build: the packages were built, tested and published by the manual run
    # before the tag existed, and building again would produce other bytes under the same version.
    # Skipping `build` skips every job that needs it, which leaves `github-release` alone.
    if: github.repository == 'farukatasoy/Tracon' && !startsWith(github.ref, 'refs/tags/')
    # Tests do not run in this job. Estimate: ubuntu ~9 min, windows ~12 min.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # MinVer derives the version from git tags; the whole history is needed.
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # For the UI build. jsdom 30 needs Node ^22.22.2 (or ^24.15, >=26). The npm cache is keyed on
      # package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      # For the gate scripts under `scripts/`. `python3` is not guaranteed on a
      # Windows runner (only `python`); installing it explicitly gives the same
      # binary on both systems. The scripts need nothing beyond the standard
      # library, and the `X | None` union type needs Python 3.10 or later.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # A manual run with a version input builds THAT version: MinVer reads
      # `MinVerVersionOverride`, so `Build` and `Pack the packages` below see the stamp and the
      # assemblies, the packages and the tar all carry it. The inputs reach the script through the
      # environment, never through the script text, and a value that is not a release version stops the
      # run here, before anything is built. A run that asks to publish without a version stops too.
      - name: Stamp the release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/gate.py release-version "$RELEASE_VERSION" --publish "$RELEASE_PUBLISH" --env-file "$GITHUB_ENV"

      # One OS is enough; this is a file-system check.
      - name: Run the repository scan
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/gate.py scan

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore the dependencies
        run: dotnet restore Tracon.slnx

      # The agent map (buildTransitive/Tracon.AgentMap.md) is GENERATED from capabilities.md but
      # COMMITTED: `dotnet pack` reads it, so the Node chain is not tied to `dotnet build`. The cost:
      # if the source changes and the generator is not run, every other gate stays green and the
      # nupkg ships a STALE map. This step closes that gap; it needs no npm dependency.
      #
      # `reference/changelog.md` and the per-release pages (`reference/releases/`) are in
      # `.gitignore` (generated from CHANGELOG.md, so there are not two copies), but
      # build-agent-map.mjs still reads them from `reference/` - the comment on `llmsBudgetBytes`
      # says plainly that this page cannot be dropped from llms.txt. On a fresh checkout `--check`
      # would leave the page out of the map and never agree with the committed version that holds
      # it. build-changelog.mjs needs no npm dependency either, so running it first does not
      # contradict the paragraph above.
      - name: Check the agent map matches its source
        run: |
          node docs-site/scripts/build-changelog.mjs
          node docs-site/scripts/build-agent-map.mjs --check

      # Content and presentation gates. The `site` job does NOT run on pull requests, so this step
      # lives HERE, not there - otherwise a red gate would stop no PR. The script uses only Node
      # built-ins and local files; measured: it runs with node_modules removed, so it needs no
      # `npm ci`.
      - name: Content and presentation gates
        working-directory: docs-site
        run: node scripts/check-content.mjs

      # Not on the `site` job: that job runs on pushes to main only, so a gate
      # placed there would stop no pull request.
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p "*_test.py" -v

      # The client's own gate: schema drift, paths coverage, error mapping, prefix and client tests.
      # It hangs on `npm test`, not on `dotnet test`, so the duration of the .NET jobs does not
      # depend on the generator or package version.
      - name: Install the TypeScript client dependencies
        working-directory: packages/tracon-client
        run: npm ci

      - name: Run the TypeScript client tests
        working-directory: packages/tracon-client
        run: npm test

      - name: Build
        run: dotnet build Tracon.slnx -c Release --no-restore

      # ---------------------------------------------------------------------
      # Single build chain. The files a release pushes to nuget.org are the files THIS step
      # produces: the build is packed with `--no-build`, the test jobs run the tar of the same
      # build, `release-dryrun` verifies the packages without repacking, and `publish` pushes the
      # same bytes.
      #
      # 🚨 The order is a contract: this step comes right after `Build`. The performance gate, the
      # capacity smoke and the fixtures of Tracon.Package.Tests rebuild src (ReleaseArtifactFixture
      # with another version; measured 2026-09-24: the SHA-256 of Tracon.Core.dll changed). None of
      # them runs in this job's workspace any more; the order stays anyway, because a step that
      # slips in between can re-stamp the build. Only the ubuntu leg packs; Windows measures the
      # platform difference.
      #
      # The baseline check belongs to the pack moment: the packages of the last released version
      # are restored from nuget.org into an isolated cache. It needs the network.
      # ---------------------------------------------------------------------
      - name: Pack the packages
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/gate.py pack --output artifacts/ci-packages

      # The set was frozen at `Pack the packages` with the manifest SHA-256s. This step proves,
      # right before the upload, that the set did not change between packing and upload. Tests do
      # not run in this job's workspace; the upload happens before a red test job, but it leaves
      # nobody unprotected on the publish path: `publish` depends on every test job, `release-dryrun`
      # on every test job that runs on pull requests, and `nuget-verified` is uploaded only when
      # they are green.
      - name: Verify the packages
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/gate.py verify-packages artifacts/ci-packages

      - name: Upload the packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts/ci-packages/*.nupkg
            artifacts/ci-packages/*.snupkg
            artifacts/ci-packages/package-manifest.json
            artifacts/ci-packages/api-compat/*.xml
          if-no-files-found: error

      # The binaries the test jobs will run. `artifacts/bin` carries each project's own output
      # directory (tests, samples, WorkerHarness, the playwright.ps1 of the E2E project); `obj` is
      # not carried. The tar keeps the execute bit. Compression is a pipeline (`gzip -1`): it works
      # the same with GNU tar and bsd tar. The size is written to the summary; the duration is read
      # from the step's own time.
      - name: Archive the build output
        shell: bash
        run: |
          mkdir -p artifacts/ci-bin
          tar -cf - artifacts/bin | gzip -1 > artifacts/ci-bin/bin.tar.gz
          ls -l artifacts/ci-bin/bin.tar.gz
          {
            echo "### bin-${{ matrix.os }}"
            echo "tar size: $(du -h artifacts/ci-bin/bin.tar.gz | cut -f1); unpacked size: $(du -sh artifacts/bin | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.os }}
          path: artifacts/ci-bin/bin.tar.gz
          # The tar is already compressed; a second zip only costs time.
          compression-level: 0
          # Only the test jobs of this run read it.
          retention-days: 1
          if-no-files-found: error
          # `overwrite` is deliberately absent. Re-running this job tries a second upload under the same
          # name and fails with 409: the bytes of a tar that earlier test jobs already ran cannot be
          # replaced silently. A new build restarts the whole run. The same rule applies to the
          # `nuget-packages` upload.

  # ---------------------------------------------------------------------------
  # Culture and time zone: .NET reads `LC_ALL` and `TZ` on Linux and does not need the locale
  # to be installed. The command is the one measured locally: on the full solution both legs
  # were green with 16,275 tests. The projects that need no Docker run here (the same solution
  # filter as the Windows legs); the database legs have their own locale in the matrix jobs
  # below.
  #
  # The condition is the same chain as `build`: every leg carries `needs: build`. It does not
  # run on pull requests (so no PR burns ten legs); it runs on `main`, tags and manual triggers.
  # This is the longest job (all modules in one job, one module at a time), so it comes first
  # in the file.
  # ---------------------------------------------------------------------------
  culture-matrix:
    name: Culture (${{ matrix.name }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Estimate: ~19 min (setup 3 + modules 15.8). Its previous value was 30.9 min, build included.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tr-TR, America/New_York
            lc_all: tr_TR.UTF-8
            tz: America/New_York
          - name: de-DE, Australia/Lord_Howe
            lc_all: de_DE.UTF-8
            tz: Australia/Lord_Howe
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Tracon.Package.Tests runs its own pack, and the UI chain (npm) starts cold in that pack.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0

      - name: Install the Playwright system dependencies
        run: |
          pwsh artifacts/bin/Tracon.Ui.E2ETests/release/playwright.ps1 install --with-deps chromium

      # The variables go only to the test process: a locale that is not installed must not print
      # warnings on the restore and apt steps.
      - name: Run tests (no Docker needed)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          LC_ALL: ${{ matrix.lc_all }}
          TZ: ${{ matrix.tz }}
        run: dotnet test --solution Tracon.no-docker.slnf -c Release --no-build --max-parallel-test-modules 1 --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-culture-${{ strategy.job-index }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-culture-${{ strategy.job-index }}
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------------
  # Ubuntu test jobs (each is a basket; one module at a time inside a basket)
  #
  # The common steps repeat at the start of every job (checkout, SDK, cache, tar, restore). A
  # red module does NOT stop the following modules: every test step runs with `!cancelled()`
  # and the job still ends red. A test step is skipped only when the restore failed.
  #
  # In place of the old step that ran the whole solution, every test project is a SEPARATE
  # step. When a new test project is added, a step must be added here; the gate test
  # (gate_test.py) checks that every test project runs in exactly one ubuntu job and (if it
  # needs no Docker) in exactly one windows job.
  #
  # Limits: limit = about twice the estimated duration, rounded up to 5 min (floor 10 min).
  # The estimates are the module durations of the old serial run (ubuntu: TwoNode 460 s,
  # SqlServer 361, Package 278, AspNetCore 154, PostgreSql 150, Sqlite 91, Workflows 65,
  # Core 64, E2E 56, Generators 40); replace them with runner measurements.
  # ---------------------------------------------------------------------------
  test-twonode:
    name: Test (TwoNode)
    needs: build
    runs-on: ubuntu-latest
    # Estimate ~10.5 min (setup 2.7 + module 7.7).
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      # A local run covers half of the workflow cancellation sweep on SQL Server; CI runs the full
      # matrix on both providers. The variable is read only by this module.
      - name: Run tests (Tracon.TwoNode.IntegrationTests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          TRACON_TEST_FULL_SWEEP: '1'
        run: dotnet test --project tests/Tracon.TwoNode.IntegrationTests/Tracon.TwoNode.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-twonode
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-twonode
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

  test-package:
    name: Test (Package, E2E)
    needs: build
    runs-on: ubuntu-latest
    # Estimate ~10.5 min (setup 3 + Package 6.1 + E2E 0.9). The fixtures of Package run their own
    # pack; the UI chain (npm) starts cold in that pack.
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      # Playwright's browser binaries do not come with the NuGet package. The test fixture downloads
      # them when missing, but on Linux the system dependencies need a separate step and that step
      # needs sudo. On a cache hit the download is skipped.
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0

      - name: Install the Playwright system dependencies
        run: |
          pwsh artifacts/bin/Tracon.Ui.E2ETests/release/playwright.ps1 install --with-deps chromium

      - name: Run tests (Tracon.Package.Tests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
