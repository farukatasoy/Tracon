name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: true
  # Python betikleri Türkçe yazar. Windows runner'ında hem `sys.stdout` hem de
  # `subprocess(text=True)` çözümlemesi varsayılan olarak **cp1252**'dir ve
  # `ş`/`ğ`/`İ` o kod sayfasında YOKTUR: ilk `print` `UnicodeEncodeError`
  # fırlatır, kapı kırmızı olur ama sebep dokümanla ilgisizdir. UTF-8 modu
  # ikisini birden çevirir (ölçüldü: `getpreferredencoding` de `utf-8` olur),
  # bu yüzden `PYTHONIOENCODING`'den geniştir. İş düzeyinde durur çünkü
  # `unittest` koşumu da Türkçe docstring yazar -- betik içi bir düzeltme o
  # adımı kapsayamazdı. Doğrulama: `PYTHONIOENCODING=cp1252` ile aynı komutlar
  # Linux'ta da patlar (16 test hatası).
  PYTHONUTF8: 1

jobs:
  build:
    name: Derle ve test et (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # MinVer surumu git etiketlerinden uretir; tum gecmis gerekir.
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Arayuz derlemesi icin. Vite 7, Node ^20.19 veya >=22.12 ister.
      # npm onbellegi package-lock.json uzerinden anahtarlanir.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      # `scripts/dokuman-bakim.py` icin. Windows runner'inda `python3` komutu
      # garanti degildir (yalniz `python`); acikca kurmak iki isletim sisteminde
      # de ayni ikiliyi verir. Script `pathlib`/`re`/`os` disinda bir sey
      # istemez, `X | None` tip birlesimi 3.10+ ister.
      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Tek OS yeterli; bu bir dosya sistemi kontroludur.
      - name: Gelistirme dongusu taramasi
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/kapi.py tarama

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Bagimliliklari geri yukle
        run: dotnet restore Tracon.slnx

      - name: Kod bicimini dogrula
        # Bicim sapmasi build'i kirar. Duzeltmek icin: dotnet format Tracon.slnx
        run: dotnet format Tracon.slnx --verify-no-changes --no-restore

      # Agent haritasi (buildTransitive/Tracon.AgentMap.md) capabilities.md'den
      # URETILIR ama COMMIT edilir: `dotnet pack` onu okur, bu yuzden Node zinciri
      # `dotnet build`e baglanmaz. Bedeli sudur - kaynak degisip uretec kosulmazsa
      # dort kapinin dordu de yesil kalir ve nupkg BAYAT harita sevk eder. Bu adim
      # o bosluktur; hicbir npm bagimliligi istemez.
      #
      # `reference/changelog.md` .gitignore'dadir (CHANGELOG.md'den uretilir,
      # kaynagiyla iki kopya olmasin diye) ama build-agent-map.mjs onu hala
      # `reference/` dizininden okur - llmsBudgetBytes yorumu bu sayfanin
      # llms.txt'ten DUSURULEMEYECEGINI acikca soyler. Taze bir checkout'ta dosya
      # yokken --check calisirsa harita bu sayfayi dislar ve COMMIT edilmis
      # (sayfayi iceren) surumle sonsuza dek uyusmaz; build-changelog.mjs de npm
      # bagimliligi istemedigi icin buraya eklemek yukaridaki yorumu bozmaz.
      - name: Agent haritasi kaynagiyla ayni mi
        run: |
          node docs-site/scripts/build-changelog.mjs
          node docs-site/scripts/build-agent-map.mjs --check

      # Icerik ve sunum kapilari. `pages` isi PULL REQUEST'te kosmaz, bu yuzden bu
      # adim ORADA degil BURADA durur - yoksa kapinin kirmizi olmasi hicbir PR'i
      # durdurmaz. Betik yalnizca node: yerlesikleri ve yerel dosyalar okur; olculdu:
      # node_modules silinmisken de kosuyor, bu yuzden `npm ci` istemez.
      - name: Icerik ve sunum kapilari
        working-directory: docs-site
        run: node scripts/check-content.mjs

      # Sicak yol dokuman butcesi, karar defteri yapisi ve site-mutlak baglanti
      # cozumu. `pages` isine KONMAZ -- o is yalniz main push'ta kosar ve
      # oraya konan bir kapi hicbir PR'i durdurmaz (Faz 80).
      - name: Dokuman kapilari
        run: python3 scripts/dokuman-bakim.py --denetle

      - name: Dokuman kapilari testleri
        run: python3 -m unittest discover -s scripts -p "*_test.py" -v

      # @tracon/client'in kendi kapisi (docs/arsiv/fazlar/84-TYPESCRIPT-ISTEMCISI-VE-NPM.md,
      # bolum 84.10): schema-drift + paths-coverage + error-mapping + prefix +
      # client testleri. `npm test`'e baglidir, `dotnet test`'e degil -- dort
      # kapinin suresi uretec/paket surumune baglanmaz.
      - name: TypeScript istemcisi bagimliliklari
        working-directory: packages/tracon-client
        run: npm ci

      - name: TypeScript istemcisi testleri
        working-directory: packages/tracon-client
        run: npm test

      - name: Derle
        run: dotnet build Tracon.slnx -c Release --no-restore

      # Faz 116: tahsis kapısı yalnız üç sıcak yoldan biri (veya bench/ kendisi)
      # değiştiyse koşar - `kapi.py performans`'ın kendi mantığı
      # (`performance_gate_triggered`) yeniden kullanılır, CI kendi diff
      # tabanını hesaplar (PR'de taban dal, push'ta önceki commit).
      - name: Performans kapisi sicak yolu degisti mi?
        if: matrix.os == 'ubuntu-latest'
        id: perf-trigger
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            TRIGGERED=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import kapi; print('true' if kapi.performance_gate_triggered(kapi.changed_paths('$BASE') or []) else 'false')")
            echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"
          fi

      # Yalnız TEK isletim sisteminde kosar: tahsis deterministiktir (116.1),
      # ucunu de kosmak ayni uc sayiyi uc kez dogrulayip suresini uctler.
      - name: Performans kapisi (tahsis)
        if: matrix.os == 'ubuntu-latest' && steps.perf-trigger.outputs.triggered == 'true'
        run: python3 scripts/kapi.py performans

      # Playwright'in tarayici ikilileri NuGet paketiyle gelmez. Test fixture'i
      # eksikse indirir, ancak Linux'ta sistem bagimliliklari ayri bir adim ister
      # ve o adim sudo gerektirir. Onbellek isabetinde indirme atlanir.
      - name: Playwright tarayicisini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.61.0

      - name: Playwright sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          pwsh artifacts/bin/Tracon.Ui.E2ETests/release/playwright.ps1 install --with-deps chromium

      # Tracon.PostgreSql.IntegrationTests ve Tracon.SqlServer.IntegrationTests
      # Testcontainers uzerinden Linux container'i baslatir. `windows-latest`
      # runner'inin Docker kurulumu Windows container icindir - Linux image
      # baslatamaz; tum solution tek `dotnet test` cagrisiyla kosulursa bu iki
      # proje Windows'ta ya sessizce atlanir ya da kirilir (Kesif 2026-08-23,
      # kalem 6). Tracon.no-docker.slnf ayni 41 projeden bu ikisini
      # cikarir - geri kalan her sey (Sqlite entegrasyonu dahil, o Docker
      # istemez) Windows'ta da gercekten kosar.
      - name: Test et (tum projeler)
        if: matrix.os == 'ubuntu-latest'
        # xunit.v3 Microsoft Testing Platform kullanir; rapor bayraklari VSTest'ten farklidir.
        # `--` sonrasi gelen argumanlar dogrudan test uygulamasina gecer.
        # TRX ciktisi test ikilisinin yanindaki TestResults klasorune yazilir.
        run: dotnet test Tracon.slnx -c Release --no-build -maxcpucount:1 -- --report-trx

      - name: Test et (Docker gerektirmeyenler)
        if: matrix.os == 'windows-latest'
        run: dotnet test Tracon.no-docker.slnf -c Release --no-build -maxcpucount:1 -- --report-trx

      # Faz 166. Kapasite APARATININ kisa dogruluk kosumu - bir yuk olcumu
      # DEGIL. Uc HTTP yolu, iki kiraci, gercek TCP, gercek SQL ve packed
      # tuketici provenance'i kontrol edilir; hicbir sure esige baglanmaz
      # (K-738). Agir profiller (sweep/arrival/workers/soak) CI'a GIRMEZ.
      #
      # 🚨 Yalniz Linux: kendi PostgreSQL container'ini baslatir ve
      # `windows-latest` runner'i Linux image calistiramaz - ayni sebep
      # Tracon.no-docker.slnf'in var olma sebebi.
      #
      # 🚨 Eksik Docker veya hazirlanmamis paket SESSIZ SKIP degil BASARISIZ
      # onkosuldur: atlanmis bir provenance kontrolu CI log'unda gecmis bir
      # kontrolden ayirt edilemez.
      - name: Kapasite smoke (packed tuketici)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/kapi.py kapasite \
            --profil smoke \
            --surum "0.0.0-ci.${{ github.run_number }}"

      - name: Kapasite smoke ciktisini yukle
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-smoke
          path: artifacts/capacity/**
          if-no-files-found: ignore

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/**/TestResults/*.trx
          if-no-files-found: ignore

  pack:
    name: Paketle
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Arayuz varliklari pack sirasinda gerekir; yoksa TRACON0003 hatasi verir.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Paketleri uret
        run: |
          dotnet restore Tracon.slnx
          dotnet build Tracon.slnx -c Release --no-restore
          dotnet pack  Tracon.slnx -c Release --no-build

      - name: Paketleri yukle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Yayın provası (docs/arsiv/fazlar/97-SURUM-POLITIKASI-VE-YAYIN-PROVASI.md, 97.2)
  #
  # `pack` isinden BAGIMSIZ calisir - kendi `dotnet pack`'ini kosar (kapi.py'nin
  # `yayin` komutunun kendisi bunu yapar, K-008 sinirini ve paket icerik
  # sozlesmesini o ciktidan olcer). Boylece `pack` ve bu is PARALEL kosar; ikisi
  # de yalniz `build`e bagimlidir.
  #
  # `--surum` GECILMEZ: bu is her push'ta (PR dahil) kosar ve o an bir etiket
  # olmayabilir. Zorlanmis bir surum yalniz INSANIN gercek etiketten ONCE
  # yerelde kostugu provada anlamlidir (MT-PKG-097). Bir GERCEK `v*` etiketinde
  # MinVer'in kendi hesapladigi surum zaten hedeftir - zorlamaya gerek yoktur.
  # ---------------------------------------------------------------------------
  release-dryrun:
    name: Yayin provasi (kapi.py yayin --kuru)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Arayuz varliklari pack sirasinda gerekir (TRACON0003).
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      # `npm publish --dry-run`'in kendi `prepublishOnly` -> `npm run build`
      # adimi icin gerekir; kapi.py'nin npm adimi bu dizinde kosar.
      - name: TypeScript istemcisi bagimliliklari
        working-directory: packages/tracon-client
        run: npm ci

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Yayin provasi
        run: python3 scripts/kapi.py yayin --kuru

  # ---------------------------------------------------------------------------
  # `npm-publish`'ten SONRA kosar (RK-011). Iki kanal PARALEL kostugu surece
  # npm tarafi kirilirsa 20 NuGet paketi KALICI olarak yayinlanmis olur ve
  # sevk edilen dokuman (`docs-site` -> `npm install @tracon/client`) var
  # olmayan bir paketi tarif eder. NuGet'te geri donus yoktur; npm'in kisitli
  # bir unpublish penceresi vardir -- bu yuzden ucuz olan kanal ONCE basar ve
  # basarisiz olursa NuGet HIC basmaz. `npm-publish` var olan surumu atlar,
  # yani ayni etiket yeniden itildiginde bu bagimlilik zinciri KIRMAZ.
  # ---------------------------------------------------------------------------
  publish:
    name: NuGet.org'a yayinla
    runs-on: ubuntu-latest
    needs: [pack, release-dryrun, npm-publish]
    permissions:
      contents: read
      id-token: write
    # Yalnizca 'v' ile baslayan etiketlerde calisir. Ornek: v1.0.0-preview.1
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget

    steps:
      - name: Paketleri indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: packages

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet.org'a OIDC ile gir
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # The nuget.org PROFILE NAME of the policy owner, not an email. The
          # policy is owned by the Tracon organization and applies only to
          # packages that organization owns, so this is the organization's
          # profile name -- a personal name here would match a different
          # owner's policy, or none.
          user: Tracon

      - name: Yayinla
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # ---------------------------------------------------------------------------
  # @tracon/client -> npm.org (docs/arsiv/fazlar/84-TYPESCRIPT-ISTEMCISI-VE-NPM.md, bolum 84.11)
  #
  # NuGet yayiniyla AYNI 'v*' etiketinde tetiklenir ve surumu AYNI etiketten
  # turetir -- iki kanal boylece YAPISAL olarak eslesir, ayri bir surum dosyasi
  # yoktur. `needs: build` yeterlidir (paket testleri orada kosuyor). Bu is
  # `publish`'ten ONCE kosar ve `publish` buna baglidir (RK-011): geri donusu
  # olmayan kanal (NuGet) en son basar.
  # ---------------------------------------------------------------------------
  npm-publish:
    name: npm.org'a yayinla
    runs-on: ubuntu-latest
    needs: [build, release-dryrun]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/tracon-client/package-lock.json

      - name: Bagimliliklari geri yukle
        working-directory: packages/tracon-client
        run: npm ci

      # MinVer .NET surumunu ayni etiketten turetir (K-007 deseni); npm'in boyle
      # bir mekanizmasi yoktur, o yuzden ayni etiketten elle turetilir.
      - name: Surumu etiketten turet
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: package.json surumunu yaz
        working-directory: packages/tracon-client
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      # `npm run generate` burada KOSMAZ -- src/schema.ts commit'lidir ve
      # `build` isindeki schema-drift testi onu zaten dogruladi. Yalniz derleme.
      - name: Paketle
        working-directory: packages/tracon-client
        run: npm run build

      # npm'de NuGet'in --skip-duplicate karsiligi yoktur; ayni surum ikinci kez
      # yayinlanirsa `npm publish` HATA ile durur. Var olan surum onceden
      # kontrol edilir; bulunursa yayinlama adimi ATLANIR, is KIRILMAZ.
      - name: Surum zaten yayinlanmis mi
        id: exists
        working-directory: packages/tracon-client
        run: |
          if npm view "@tracon/client@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "already published — atlaniyor"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # @tracon kapsamli bir paket varsayilan PRIVATE'tir; --access public
      # unutulursa paket yayinlanir ama kimse kuramaz (Kabul case 8).
      - name: Yayinla
        if: steps.exists.outputs.value == 'false'
        working-directory: packages/tracon-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # GitHub release (docs/arsiv/fazlar/123-YAYIN-KRITIK-YOLU.md, 123.3)
  #
  # `publish` VE `npm-publish`'ten SONRA kosar: paket yayini bu ise bagli
  # KALMAZ, yalniz release sayfasi eksik kalir GitHub API erisilemezse (OP-007
  # hata modu tablosu). Govde CHANGELOG.md'nin o surume ait bolumudur --
  # `scripts/changelog.py` kapi.py'nin surum-notu kapisiyla AYNI ayrıştırıcıdır,
  # iki ayri parser yazmak drift uretirdi. Surum bolumu yoksa `## [Unreleased]`
  # okunur: bolum ETIKET aninda yazilir, yani bu is kosarken heniz yazilmamis
  # olabilir (K-825). Iki taraf ayni fallback'i kullanmazsa prova yesil,
  # release govdesi bos olurdu.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub release olustur
    runs-on: ubuntu-latest
    needs: [publish, npm-publish]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Etiket adindan 'v' onekini dusurmek CHANGELOG basligindaki surumle
      # eslesir (`## [1.0.0-preview.1]`, `v` onceki degil). Etiket adi ortam
      # degiskeniyle tasinir - bir YAML ifadesini Python string literaline
      # gommek yerine (tag adinda `'` teorik olarak yasak degildir).
      - name: Surum notlarini CHANGELOG.md'den cikar
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os
          import pathlib
          import sys
          sys.path.insert(0, 'scripts')
          import changelog

          version = os.environ['TAG_NAME'].removeprefix('v')
          body, heading = changelog.read_release_notes(pathlib.Path('CHANGELOG.md'), version)
          if not body:
              sys.exit(f\"CHANGELOG.md has no '## [{version}]' and no '## [Unreleased]' section\")
          print(f'release notes read from: ## [{heading}]')
          pathlib.Path('release-notes.md').write_text(body, encoding='utf-8')
          "

      # Ayni etiket yeniden itilirse is KIRILMAZ - npm-publish'in "already
      # published" deseniyle ayni fikir: var olan release atlanir.
      - name: Release zaten var mi
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already exists — atlaniyor"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub release olustur
        if: steps.exists.outputs.value == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md

  # ---------------------------------------------------------------------------
  # Dokuman sitesi (docs-site/) kapilari
  #
  # Bu is YAYINLAMAZ. Site kendi sunucumuzda barinir ve yayini
  # `scripts/site-deploy.sh` yapar -- ozel repo'da GitHub Pages ucretli plan
  # ister (K-542). Burada kalan sey, siteyi DERLEYIP kapilarini kosmaktir:
  # derlenmeyen bir site yayin gunune kadar sessiz kalmasin.
  #
  # Site AYRI bir yayin hattidir: `dotnet build`'e baglanmaz ve pakete girmez.
  # Yine de .NET derlemesine ihtiyac duyar -- API referansi DocFX ile derlenmis
  # assembly + XML dokumanindan uretilir (MSBuild devrede degil, K-4xx).
  # Arayuz varliklari gerekmez, bu yuzden TraconFrontendEnabled=false ile
  # npm/Vite adimlari atlanir.
  #
  # Ekran goruntuleri docs-site/public/screenshots altinda COMMIT'LIDIR; E2E
  # kosumundan uretilirler (DocumentationScreenshotTests). Bu is Playwright
  # calistirmaz.
  #
  # 🚨 Is PR'de KOSMAZ ve bu bilincli bir bosluktur: ozel repo'nun Actions
  # dakikasi sinirlidir ve `site-deploy.sh` dort kapiyi yayindan once zaten
  # kosar. Bir PR'i durdurmasi gereken kapi `build` isine konur -- oradaki
  # `check-content.mjs` adimi tam olarak bu sebeple oradadir.
  # ---------------------------------------------------------------------------
  site:
    name: Dokuman sitesi kapilari
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Astro 7 >= 22.12 ister; arayuzun Vite 7'si ^20.19 ile de calisiyordu.
      # Iki hat ayni surumu kullanir.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Assembly ve XML dokumanini uret
        run: |
          dotnet restore Tracon.slnx
          dotnet build Tracon.slnx -c Release --no-restore -p:TraconFrontendEnabled=false

      - name: DocFX aracini geri yukle
        run: dotnet tool restore

      - name: Site bagimliliklari
        working-directory: docs-site
        run: npm ci

      - name: Siteyi derle
        working-directory: docs-site
        run: npm run build

      # Uretilen sitede kirik ic baglanti olmamalidir. API referansi uid'lerden,
      # HTTP API sayfalari etiketlerden baglanti kurar; bir yeniden adlandirma
      # sessizce baglanti kirar.
      - name: Ic baglantilari denetle
        working-directory: docs-site
        run: npm run check:links

      # Sayfa agirligi taban cizgisi. Uretilen dist/ uzerinden olculur, bu yuzden
      # derlemeden SONRA kosar.
      - name: Sayfa agirligini denetle
        working-directory: docs-site
        run: npm run check:weight

      - name: Nginx SEO HTTP sözleşmesini denetle
        shell: bash
        run: |
          site_domain="$(node --input-type=module -e "import {site} from './docs-site/site.config.mjs'; process.stdout.write(new URL(site).hostname)")"
          docker run -d --rm --name tracon-seo -p 127.0.0.1:4175:8080 \
            -e SITE_HOST="$site_domain" -e NGINX_ENVSUBST_FILTER=SITE_HOST \
            -v "$PWD/docs-site/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/docs-site/deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine
          trap 'docker stop tracon-seo' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/site-http-denetle.py http://127.0.0.1:4175
