          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      # The system temporary directory of a Windows runner is on the system disk and the runner's own is on the
      # data disk. The runner card measured a SQLite commit loop 9 to 30 times slower in the first, on all nine
      # Windows jobs of three runs, and equal on Linux. Test databases are created in the temporary directory, so
      # it is moved BEFORE the first test step; the card above still prints the machine as it is.
      - name: Use the runner's own temporary directory
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Tracon.Package.Tests runs its own pack, and the UI chain (npm) starts cold in that pack.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-windows-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      # Windows needs no system-dependency step; the test fixture downloads the browser when it is
      # missing. On a cache hit the download is skipped.
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0

      - name: Run tests (Tracon.AspNetCore.FunctionalTests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.AspNetCore.FunctionalTests/Tracon.AspNetCore.FunctionalTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Run tests (Tracon.Package.Tests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.Package.Tests/Tracon.Package.Tests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Run tests (Tracon.Ui.E2ETests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.Ui.E2ETests/Tracon.Ui.E2ETests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      # A test that fails on purpose, and a look for the evidence its failure must leave. Green means the
      # test went red AND the evidence is there.
      - name: Prove the failure evidence (host)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: ./.github/actions/evidence-selftest
        with:
          kind: host

      # A test that fails on purpose, and a look for the evidence its failure must leave. Green means the
      # test went red AND the evidence is there.
      - name: Prove the failure evidence (page)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: ./.github/actions/evidence-selftest
        with:
          kind: page

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-web
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-windows-web
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

