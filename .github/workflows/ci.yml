  # ---------------------------------------------------------------------------
  # Platform matrix
  #
  # Every row of the platform table in the site's `reference/compatibility.md` is proved by one
  # leg. The commands of the legs are the ones first run locally (the same environment
  # variables, the same test project).
  #
  # The condition is the same as `build`: the canonical repository only. Every leg carries
  # `needs: build`, because the repository guard sits only in `build` and a skipped dependency
  # skips them too; a gate test enforces this chain. They do not run on pull requests (so no PR
  # burns ten legs); they run on `main`, tags and manual triggers. The default-image legs
  # (`test-postgres`, `test-sqlserver`) also run on PRs and are outside these matrices.
  #
  # A leg is a set of environment variables. The test class does not change: `SqlServerFixture`
  # and `PostgresFixture` read the variables; an empty value keeps the default. The legs use the
  # tar of the `build` job; they do not compile.
  # ---------------------------------------------------------------------------
  sqlserver-matrix:
    name: SQL Server (${{ matrix.name }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Estimate ~9.5 min (module 361 s in the old serial run; the longest local run was 14 min,
    # under amd64 emulation).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest server version: `src/Tracon.SqlServer/README.md` says 2019+.
          - name: '2019'
            image: mcr.microsoft.com/mssql/server:2019-latest
            collation: ''
            lcid: ''
          # Turkish collation: `Turkish_CI_AS` and `MSSQL_LCID=1055` are given TOGETHER; if only the
          # collation is given the server language stays English and a connection returned from the
          # pool fails when it is reset.
          - name: '2022, Turkish_CI_AS'
            image: mcr.microsoft.com/mssql/server:2022-latest
            collation: Turkish_CI_AS
            lcid: '1055'
          # Newest server version: the whole project passed on it before the leg was added (1 797 tests,
          # 5 min 20 s under amd64 emulation). `latest` moves with the newest release, like the 2019 and
          # 2022 tags above.
          - name: '2025'
            image: mcr.microsoft.com/mssql/server:2025-latest
            collation: ''
            lcid: ''
    env:
      TRACON_TEST_SQLSERVER_IMAGE: ${{ matrix.image }}
      TRACON_TEST_SQLSERVER_COLLATION: ${{ matrix.collation }}
      TRACON_TEST_SQLSERVER_LCID: ${{ matrix.lcid }}
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Run tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.SqlServer.IntegrationTests/Tracon.SqlServer.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sqlserver-${{ strategy.job-index }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-sqlserver-${{ strategy.job-index }}
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

  postgres-matrix:
    name: PostgreSQL (${{ matrix.name }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Estimate ~5.5 min (module 150 s in the old serial run; the longest local run was 7 min on
    # a loaded machine, 1594 tests, image ready).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '12'
            image: pgvector/pgvector:pg12
            icu: ''
          - name: '13'
            image: pgvector/pgvector:pg13
            icu: ''
          - name: '14'
            image: pgvector/pgvector:pg14
            icu: ''
          - name: '15'
            image: pgvector/pgvector:pg15
            icu: ''
          - name: '16'
            image: pgvector/pgvector:pg16
            icu: ''
          - name: '17'
            image: pgvector/pgvector:pg17
            icu: ''
          # Default image (18) with a Turkish ICU locale: the behaviour of `lower()` and comparison
          # changes on this leg.
          - name: '18, ICU tr-TR'
            image: ''
            icu: tr-TR
    env:
      TRACON_TEST_POSTGRES_IMAGE: ${{ matrix.image }}
      TRACON_TEST_POSTGRES_ICU_LOCALE: ${{ matrix.icu }}
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Run tests
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.PostgreSql.IntegrationTests/Tracon.PostgreSql.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-postgres-${{ strategy.job-index }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-postgres-${{ strategy.job-index }}
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

  # The SQLite driver carries a native library; the version is that library's version. The leg
  # replaces the library packaged by `Microsoft.Data.Sqlite` with an older version of the same
  # family (`SQLitePCLRaw.lib.e_sqlite3`) and runs the same test project.
  # `SqliteEngineVersionTests` verifies that the engine really is the requested version: if the
  # replacement fails silently, the leg is red.
  sqlite-floor:
    name: SQLite ${{ matrix.sqlite }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Estimate ~5.5 min (module 91 s in the old serial run). 1.5 min locally (macOS, warm cache).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - native: '2.1.7'
            sqlite: '3.44.0'
    env:
      TRACON_TEST_SQLITE_VERSION: ${{ matrix.sqlite }}
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Replace the native library with the older version
        env:
          NATIVE_VERSION: ${{ matrix.native }}
        run: |
          # The project sits outside the repo: Directory.Packages.props (central package management) would otherwise apply to it too.
          mkdir -p "${RUNNER_TEMP}/sqlite-native"
          cat > "${RUNNER_TEMP}/sqlite-native/Fetch.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="SQLitePCLRaw.lib.e_sqlite3" Version="${NATIVE_VERSION}" /></ItemGroup>
          </Project>
          EOF
          dotnet restore "${RUNNER_TEMP}/sqlite-native/Fetch.csproj" --packages "${RUNNER_TEMP}/sqlite-native/packages"
          cp "${RUNNER_TEMP}/sqlite-native/packages/sqlitepclraw.lib.e_sqlite3/${NATIVE_VERSION}/runtimes/linux-x64/native/libe_sqlite3.so" \
            artifacts/bin/Tracon.Sqlite.IntegrationTests/release_net10.0/runtimes/linux-x64/native/libe_sqlite3.so

      - name: Run tests
        run: dotnet test --project tests/Tracon.Sqlite.IntegrationTests/Tracon.Sqlite.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-sqlite-floor
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-sqlite-floor
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------------
  # Non-test gates. They were split from `build` so they run in parallel without delaying the
  # build chain, and `release-dryrun` waits for each of them: a red gate stops the rehearsal
  # and the release as before.
  # ---------------------------------------------------------------------------
  format:
    name: Code format (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Estimate ~7 min (the ubuntu step took 223 s in the old serial run).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # The environment of the old step is kept: the format check ran on a runner with Node
      # installed, without node_modules.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore the dependencies
        run: dotnet restore Tracon.slnx

      - name: Verify the code format
        # A format deviation breaks the build. To fix it: dotnet format Tracon.slnx
        run: dotnet format Tracon.slnx --verify-no-changes --no-restore

  # The allocation gate runs only when one of the four hot paths (or bench/ itself) changed - it
  # reuses the logic of `gate.py perf` (`performance_gate_triggered`); CI computes its own diff
  # base (the base branch on a PR, the previous commit on a push).
  #
  # 🚨 On a TAG push `github.event.before` is forty zeros - that commit does not exist, so no
  # diff can be computed. This used to fall into the "base could not be resolved" branch below
  # and trigger the gate unconditionally BY ACCIDENT. The result was measured (2026-09-20): the
  # gate stayed `skipped` across 21 pushes, its first real run was the first `v*` tag, and it
  # failed there - a gate that ran only on the release path and had never been tried. A tag is
  # now handled EXPLICITLY: the commit the tag points to was already built and measured on main,
  # so the gate does not run on a tag. The decision is not left to a side effect of the zero SHA.
  #
  # The gate rebuilds src; so it runs in its own job, not in the workspace of `build`.
  performance:
    name: Performance gate (allocation)
    needs: build
    runs-on: ubuntu-latest
    # Estimate ~2 min when not triggered, ~8 min when triggered (~220 s inside `gate.py close`).
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Check whether a hot path changed
        id: perf-trigger
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            echo "tag push - the allocation gate was measured on main and does not run here"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            TRIGGERED=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import gate; print('true' if gate.performance_gate_triggered(gate.changed_paths('$BASE') or []) else 'false')")
            echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"
          fi

      - name: Performance gate (allocation)
        if: steps.perf-trigger.outputs.triggered == 'true'
        run: python3 scripts/gate.py perf

  # A short validity run of the capacity HARNESS - not a load measurement. It checks three HTTP
  # paths, two tenants, real TCP, real SQL and the provenance of the packed consumer; no
  # duration is tied to a threshold. The heavy profiles (sweep/arrival/workers/soak/nodes) do
  # NOT enter CI.
  #
  # The harness builds its own package (isolated feed, its own version) and rebuilds src; so it
  # runs in its own job, not in the workspace of `build`.
  #
  # 🚨 Linux only: it starts its own PostgreSQL container and the `windows-latest` runner cannot
  # run a Linux image - the same reason `Tracon.no-docker.slnf` exists.
  #
  # 🚨 Missing Docker or an unprepared package is a FAILED precondition, not a SILENT SKIP: a
  # skipped provenance check cannot be told apart from a passed one in the CI log.
  capacity:
    name: Capacity smoke (packed consumer)
    needs: build
    runs-on: ubuntu-latest
    # Estimate ~9 min (setup 2 + pack 3 + smoke 2.4; the longest earlier step was 4.2 min, without
    # the pack).
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # The pack of the harness builds the UI assets (TRACON0003).
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Capacity smoke (packed consumer)
        timeout-minutes: 20
        run: |
          python3 scripts/gate.py capacity \
            --profile smoke \
            --package-version "0.0.0-ci.${{ github.run_number }}"

      - name: Upload the capacity smoke output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-smoke
          path: artifacts/capacity/**
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------------
  # Release rehearsal
  #
  # It does NOT run its own `dotnet pack`. It downloads the `nuget-packages` artifact packed by
  # the ubuntu leg of `build` and verifies it with `gate.py release --dry-run
  # --package-directory`: manifest SHA-256s, commit and base equality, the pre-release limit,
  # the package content contract, the breaking-change report, external samples and the AOT
  # smoke. The verified set is uploaded as `nuget-verified` with its SHA-256 manifest; `publish`
  # pushes ONLY that. Byte equality is checked on every push (PRs included) - there is no new
  # logic on the tag path.
  #
  # The job depends on `build` and on EVERY test and gate job that also runs on PRs: a red
  # module stops the rehearsal and therefore the release. Jobs skipped on PRs (the matrices,
  # culture) do NOT belong here - a skipped dependency would skip this job too, and the
  # rehearsal must run on every push (PRs included). Those jobs are dependencies of `publish`.
  #
  # An ordinary run does not pass `--package-version`: the job runs on every push (PRs included)
  # and the version is whatever MinVer computes. A manual run with a version input passes it, and
  # the rehearsal then demands that the packages carry exactly that version and that CHANGELOG.md
  # holds its dated section: the same checks a release has to pass before the publish jobs start.
  # A cut release that waits for its tag is rehearsed by the ordinary run too: its notes are read
  # from its section.
  # ---------------------------------------------------------------------------
  release-dryrun:
    name: Release rehearsal (gate.py release --dry-run --package-directory)
    runs-on: ubuntu-latest
    needs: [build, format, performance, capacity, test-fast, test-aspnetcore, test-sqlite, test-twonode, test-package, test-postgres, test-sqlserver, test-windows-sqlite, test-windows-core, test-windows-web]
    # Longest measured 5.7 min (when it packed on its own). The pack no longer happens in this job.
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Only for `npm publish --dry-run` (the npm step of gate.py). This job does not pack; the UI
      # assets (TRACON0003) are needed in `build`.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/tracon-client/package-lock.json

      # Needed for the `prepublishOnly` -> `npm run build` step of `npm publish --dry-run` itself;
      # the npm step of gate.py runs in this directory.
      - name: Install the TypeScript client dependencies
        working-directory: packages/tracon-client
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # `artifacts/` is in .gitignore: the downloaded directory does not dirty an early git check
      # (WorkflowWorkspacePathsTests).
      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: artifacts/ci-packages

      - name: Run the release rehearsal
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$RELEASE_VERSION" ]; then
            args+=(--package-version "$RELEASE_VERSION")
          fi
          python3 scripts/gate.py release --dry-run --package-directory artifacts/ci-packages "${args[@]}"

      - name: Upload the verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-verified
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
            artifacts/package/release/package-manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Runs AFTER `npm-publish`. If the two channels ran in PARALLEL and the npm side broke, the
  # NuGet packages would be published PERMANENTLY and the shipped documentation (`docs-site` ->
  # `npm install @tracon/client`) would describe a package that does not exist. NuGet has no way
  # back; npm has a limited unpublish window - so the cheap channel goes FIRST, and if it fails
  # NuGet does not publish AT ALL. `npm-publish` skips a version that already exists, so
  # running the failed job of a release again does not break this dependency chain.
  #
  # `publish` depends DIRECTLY on EVERY test job and matrix leg of the SAME run (a repository
  # check enforces this single build chain): a red module, database version or culture leg,
  # whichever job it sits in, stops the write to nuget.org. `site` is NOT in this list: it does
  # not run on tags and a skipped dependency would skip `publish` too.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [release-dryrun, npm-publish, test-fast, test-aspnetcore, test-sqlite, test-twonode, test-package, test-postgres, test-sqlserver, test-windows-sqlite, test-windows-core, test-windows-web, postgres-matrix, sqlserver-matrix, sqlite-floor, culture-matrix]
    # Longest measured 0.5 min; floor 10 min. If the limit cuts in the middle of a push, part of
    # the packages stay published; `--skip-duplicate` makes re-running the job safe. Checkout,
    # Python and verification were added (each takes seconds).
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Runs only in a manual run on `main` that asks to publish and names the version. A tag does not
    # publish: the tag is placed after the packages are on nuget.org.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != '' && github.ref == 'refs/heads/main'
    environment: nuget

    # This job does NOT build or pack. It downloads the `nuget-verified` set that `release-dryrun`
    # verified, re-checks it with the SAME command the rehearsal used (`gate.py verify-packages`)
    # and pushes exactly those bytes. The verification runs BEFORE the login: while repository
    # code runs, there is no API key.
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # 🚨 Under `artifacts/`: the repo tracks `packages/tracon-client/`; the old download path
      # `packages` would collide with the checkout.
      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-verified
          path: artifacts/nuget-verified

      - name: Verify the packages
        run: python3 scripts/gate.py verify-packages artifacts/nuget-verified

      # nuget.org has no way back, and a second run of the same version builds new bytes: with
      # `--skip-duplicate` it would leave the packages of two builds under one version. So the push goes
      # on only when none of the packages is there yet, or when the ones that are there name THIS commit
      # (the failed job of the same run, run again). A package of another commit, or a nuget.org that
      # does not answer, stops the job. It runs before the login, like the verification above.
      - name: Check what nuget.org already holds of this version
        run: python3 scripts/gate.py publish-guard --package-directory artifacts/nuget-verified

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to NuGet.org with OIDC
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # 🚨 The nuget.org PROFILE NAME of the person who CREATED the policy, not the owner it applies
          # to, and not an email. The policy is OWNED by the Tracon organization, but passing `Tracon`
          # here fails. Measured 2026-09-20 on the first tag that reached this step:
          #
          #   Token exchange failed (HTTP 401) ... Make sure you are using the
          #   username of the policy creator, not the policy owner: No matching
          #   trust policy owned by user 'Tracon' was found.
          #
          # nuget.org's own documentation says the same: this is "your nuget.org username (profile
          # name)" - the account that signs in and holds the policy. Policy OWNERSHIP (an individual or
          # an org) only decides which packages the policy may publish; it never changes who exchanges
          # the token.
          user: farukatasoy

      - name: Push the packages to NuGet.org
        run: >
          dotnet nuget push "artifacts/nuget-verified/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # ---------------------------------------------------------------------------
  # @tracon/client -> npm.org
  #
  # Runs in the SAME manual run as the NuGet release and takes its version from the SAME input -
  # the two channels match STRUCTURALLY; there is no separate version file. This job runs
  # BEFORE `publish` and `publish` depends on it: the channel with no way back (NuGet)
  # publishes last. Tests no longer run inside `build`; this job depends, through
  # `release-dryrun`, on every test job that also runs on PRs, and on the matrix legs as well:
  # while any leg is red npm is not written either, otherwise the release would be left half
  # done (npm published, NuGet stopped).
  # ---------------------------------------------------------------------------
  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, release-dryrun, postgres-matrix, sqlserver-matrix, sqlite-floor, culture-matrix]
    # Longest measured 0.3 min; floor 10 min. Re-running is safe: an existing version is skipped
    # ("Check whether the version is already published").
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != '' && github.ref == 'refs/heads/main'
    environment: npm

    # `id-token: write` is npm trusted publishing (OIDC): the runner gets a short-lived identity
    # token and npm matches it to the `Tracon` repository, `ci.yml` and the `npm` environment.
    # `contents: read` is written separately: when a job sets `permissions`, everything not
    # written is closed and checkout could not read.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/tracon-client/package-lock.json

      # Node 22 ships npm 10.9; `npm publish` with OIDC works from 11.5.1 and the dist-tag operation
      # from 11.21.0 (docs.npmjs.com/trusted-publishers). The version is PINNED: `latest` would
      # change one day at publish time.
      - name: Upgrade npm to the trusted publishing version
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Restore the dependencies
        working-directory: packages/tracon-client
        run: npm ci

      # The .NET version is the stamped input; npm has no such mechanism, so the same input is carried
      # over by hand. It was validated by `build` (this job needs it), and it reaches the shell through
      # the environment, never through the script text.
      - name: Take the version from the input
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the version into package.json
        working-directory: packages/tracon-client
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      # `npm run generate` does NOT run here - src/schema.ts is committed and the schema-drift test
      # in `build` already verified it. Build only.
      - name: Build the npm package
        working-directory: packages/tracon-client
        run: npm run build

      # npm has no counterpart of NuGet's --skip-duplicate; publishing the same version twice makes
      # `npm publish` stop with an ERROR. An existing version is checked beforehand; if found on a later
      # attempt of the run, the publish step is SKIPPED and the job does NOT fail.
      #
      # A version that is already there on the FIRST attempt of a run was published by ANOTHER run, whose
      # build is not this one: skipping would leave the npm package from one build and the NuGet packages
      # from another under one version, and nothing downstream compares the two. The job stops instead.
      # On a later attempt (the failed jobs of this same run run again) the version is this run's own, from
      # the attempt that failed after the publish, and skipping is right.
      - name: Check whether the version is already published
        id: exists
        working-directory: packages/tracon-client
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if npm view "@tracon/client@$RELEASE_VERSION" version >/dev/null 2>&1; then
            if [ "$RUN_ATTEMPT" = "1" ]; then
              echo "::error::@tracon/client@$RELEASE_VERSION is already on npm and this is the first attempt of this run: another run published it from another build. Do not start a new run of the same version; cut the next number."
              exit 1
            fi
            echo "already published by an earlier attempt of this run - skipping the publish step"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # A scoped @tracon package is PRIVATE (restricted) by default; if --access public is
      # forgotten the package publishes but nobody can install it.
      - name: Publish to npm
        if: steps.exists.outputs.value == 'false'
        working-directory: packages/tracon-client
        run: |
          version="${{ steps.version.outputs.value }}"
          if [[ "$version" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi
        # No token: the trusted publisher registered for this workflow and the `npm` environment is the
        # only way in, and the publish carries provenance (checked on the 1.0.0-preview.10 release).

      # Preview versions must not be installed silently by a bare `npm install` - but npm does NOT
      # let the `latest` tag be deleted: DELETE .../dist-tags/latest returns 403, and the FIRST
      # publish of a package binds `latest` to that version whatever --tag says. That is how the
      # live latest=1.0.0-preview.1 came about, and on the preview.2 publish `dist-tag rm` broke the
      # job with 403. So the goal is not "remove latest" but "make latest point to the least harmful
      # version":
      #   a stable exists  -> `latest` is NOT touched; a preview gets only `next`
      #   no stable exists -> `latest` moves to the newest preview. Since it cannot be deleted,
      #                       being stuck on an old preview is worse than the newer one that carries
      #                       the fixes; the install text still says `@next` and at the first
      #                       stable publish `latest` moves there.
      # The step also runs when the version is already published; it fixes the dist-tag and does not
      # touch the immutable package bytes. Re-running an OLD tag must NOT move the dist-tag BACK, so
      # it first asks "is there a newer release?".
      # Limit: npm's `>` range does not see prereleases of a different major/minor/patch
      # (`>1.0.0-preview.2` does not find 1.0.1-preview.1), so the guard is not complete in that
      # corner.
      - name: Align the npm dist-tags
        working-directory: packages/tracon-client
        run: |
          version="${{ steps.version.outputs.value }}"
          if npm view "@tracon/client@>$version" version >/dev/null 2>&1; then
            echo "::notice::$version is not the newest release - the dist-tags stay as they are"
            exit 0
          fi
          if [[ "$version" == *-* ]]; then
            npm dist-tag add "@tracon/client@$version" next
            stable="$(npm view @tracon/client versions --json 2>/dev/null \
              | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tail -n1 | tr -d '"' || true)"
            if [[ -z "$stable" ]]; then
              npm dist-tag add "@tracon/client@$version" latest
              echo "::notice::no stable release exists - latest now points to $version (npm does not let a tag be deleted)"
            fi
          else
            npm dist-tag add "@tracon/client@$version" latest
          fi

  # ---------------------------------------------------------------------------
  # GitHub release
  #
  # Runs in the TAG run, which comes AFTER the publish: the tag is placed on the commit the published
  # packages name. The package release does not depend on this job - if the GitHub API is
  # unreachable, only the release page is missing. The job has no `needs`: `build` does not run on a
  # tag, so nothing that depends on it does either. It therefore carries the canonical-repository
  # condition itself, and it opens the page only after checking that every package of the version is
  # on nuget.org from THIS commit and that npm has the version. A tag pushed on any other commit, or
  # before the publish, leaves the page unwritten.
  #
  # The body is the section of CHANGELOG.md for that version - `scripts/changelog.py` is the SAME
  # parser as the release-notes gate of gate.py; writing two separate parsers would produce drift. The
  # release is cut before it is published, so the dated section exists at the tagged commit; if it
  # does not, `## [Unreleased]` is read, the same fallback the rehearsal uses.
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    # Longest measured 0.1 min; floor 10 min.
    timeout-minutes: 10
    if: github.repository == 'farukatasoy/Tracon' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check that the version is published from this commit
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          version="${TAG_NAME#v}"
          python3 scripts/gate.py verify-published --version "$version" --commit "$TAG_COMMIT"
          npm view "@tracon/client@$version" version

      # GitHub rejects a release body longer than 125,000 characters (HTTP 422, v1.0.0-preview.4);
      # long notes are cut at whole `###` groups and the rest links to the full note on the site
      # (`changelog.github_release_body`). Dropping the 'v' prefix of the tag name matches the
      # version in the CHANGELOG heading (`## [1.0.0-preview.1]`, no `v` before it). The tag name is
      # carried in an environment variable - instead of embedding a YAML expression in a Python
      # string literal (a `'` in a tag name is theoretically not forbidden).
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os
          import pathlib
          import sys
          sys.path.insert(0, 'scripts')
          import changelog

          version = os.environ['TAG_NAME'].removeprefix('v')
          body, heading = changelog.read_release_notes(pathlib.Path('CHANGELOG.md'), version)
          if not body:
              sys.exit(f\"CHANGELOG.md has no '## [{version}]' and no '## [Unreleased]' section\")
          print(f'release notes read from: ## [{heading}]')
          release_body = changelog.github_release_body(body, version)
          if release_body != body:
              print(f'notes cut from {len(body)} to {len(release_body)} characters to fit a GitHub release')
          pathlib.Path('release-notes.md').write_text(release_body, encoding='utf-8')
          "

      # Re-pushing the same tag does NOT fail the job - the same idea as the "already published"
      # pattern of npm-publish: an existing release is skipped.
      - name: Check whether the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already exists - skipping the create step"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub release
        if: steps.exists.outputs.value == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"

  # ---------------------------------------------------------------------------
  # Documentation site (docs-site/) gates
  #
  # This job does NOT publish. The site is served from the maintainers' own server and is
  # published from there, not from a workflow; the publisher runs all the site checks again
  # before anything goes live. What this job does is build the site and run its gates, so a
  # site that does not build does not stay quiet until publication day.
  #
  # The site is a SEPARATE publication pipeline: it is not tied to `dotnet build` and does not
  # enter a package. It still needs the .NET build - the API reference is generated by DocFX
  # from the compiled assembly and its XML documentation (DocFX does not load the projects
  # through MSBuild). The UI assets are not needed, so TraconFrontendEnabled=false skips the
  # npm/Vite steps.
  #
  # The screenshots under docs-site/public/screenshots are COMMITTED; they are produced by the
  # E2E run (DocumentationScreenshotTests). This job does not run Playwright.
  #
  # 🚨 The job does NOT run on PRs and that is a deliberate gap: it takes about eight minutes
  # and the publisher runs the same gates before publishing anyway. A gate that must stop a PR
  # goes into the `build` job - the `check-content.mjs` step there is placed for exactly this
  # reason.
  # ---------------------------------------------------------------------------
  site:
    name: Docs site gates
    runs-on: ubuntu-latest
    needs: build
    # Longest measured 7.9 min.
    timeout-minutes: 20
    if: (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Astro 7.4 needs >= 22.22; the jsdom 30 of the UI needs ^22.22.2. Both pipelines use the
      # same version.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Generate the assembly and the XML documentation
        run: |
          dotnet restore Tracon.slnx
          dotnet build Tracon.slnx -c Release --no-restore -p:TraconFrontendEnabled=false

      - name: Restore the DocFX tool
        run: dotnet tool restore

      - name: Install the site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build the site
        working-directory: docs-site
        run: npm run build

      # The generated site must have no broken internal links. The API reference links from uids and
      # the HTTP API pages link from tags; a rename silently breaks links.
      - name: Check the internal links
        working-directory: docs-site
        run: npm run check:links

      # Page-weight baseline. It is measured on the generated dist/, so it runs AFTER the build.
      - name: Check the page weight
        working-directory: docs-site
        run: npm run check:weight

      - name: Check the Nginx SEO HTTP contract
        shell: bash
        run: |
          site_domain="$(node --input-type=module -e "import {site} from './docs-site/site.config.mjs'; process.stdout.write(new URL(site).hostname)")"
          docker run -d --rm --name tracon-seo -p 127.0.0.1:4175:8080 \
            -e SITE_HOST="$site_domain" -e NGINX_ENVSUBST_FILTER=SITE_HOST \
            -v "$PWD/docs-site/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/docs-site/deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine
          trap 'docker stop tracon-seo' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/site-http-check.py http://127.0.0.1:4175
