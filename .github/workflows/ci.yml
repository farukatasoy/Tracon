  # ---------------------------------------------------------------------------
  # Windows test jobs
  #
  # The Docker installation of the `windows-latest` runner is for Windows containers - it
  # cannot start a Linux image. TwoNode, PostgreSql and SqlServer do not run here;
  # `Tracon.no-docker.slnf` defines the same set. The sandbox script tests show as SKIPPED on
  # Windows when `/bin/bash` is missing (Assert.SkipWhen); the ubuntu jobs run them. The baskets
  # are balanced with the Windows module durations (Sqlite 541 s, Workflows 297, AspNetCore 233,
  # Package 203, Core 48, E2E 40, Generators 28); replace them with runner measurements. The
  # Windows jobs have no Docker step and no Playwright system-dependency step (the ubuntu jobs
  # have the latter).
  # ---------------------------------------------------------------------------
  test-windows-sqlite:
    name: Test (windows, SQLite)
    needs: build
    runs-on: windows-latest
    # Estimate ~12 min (setup 3 + module 9).
    timeout-minutes: 40
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # What the runner is, in the log of every test job: cores, memory, free disk, where the
      # temporary directories are and how long a SQLite commit loop takes in each.
      - name: Describe the runner
        uses: ./.github/actions/runner-card

      # The system temporary directory of a Windows runner is on the system disk and the runner's own is on the
      # data disk. The runner card measured a SQLite commit loop 9 to 30 times slower in the first, on all nine
      # Windows jobs of three runs, and equal on Linux. Test databases are created in the temporary directory, so
      # it is moved BEFORE the first test step; the card above still prints the machine as it is.
      - name: Use the runner's own temporary directory
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache the NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-windows-latest
          path: artifacts/ci-bin

      - name: Unpack the build output
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Restore the dependencies
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Run tests (Tracon.Sqlite.IntegrationTests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.Sqlite.IntegrationTests/Tracon.Sqlite.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-sqlite
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

      - name: Upload the failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-windows-sqlite
          path: artifacts/test-results/**/evidence*/**
          if-no-files-found: ignore
          overwrite: true

