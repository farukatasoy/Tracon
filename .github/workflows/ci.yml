name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Ayni dalin (veya PR'in) eski kosumu, yenisi gelince iptal edilir: eski commit'in
# sonucu kimseyi ilgilendirmez ve runner dakikasi yanmaz. Etiket kosumu ASLA iptal
# edilmez - yayin yari yolda kesilmemeli. Elle tetiklemenin grubu `run_id` icerir:
# olcum icin birbiri ardindan tetiklenen kosumlar birbirini iptal etmez. Iptal
# edilen kosumun karari yoktur (`remote_state` iptal edilmis kosumu atlar).
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: true
  # Python betikleri Türkçe yazar. Windows runner'ında hem `sys.stdout` hem de
  # `subprocess(text=True)` çözümlemesi varsayılan olarak **cp1252**'dir ve
  # `ş`/`ğ`/`İ` o kod sayfasında YOKTUR: ilk `print` `UnicodeEncodeError`
  # fırlatır, kapı kırmızı olur ama sebep dokümanla ilgisizdir. UTF-8 modu
  # ikisini birden çevirir (ölçüldü: `getpreferredencoding` de `utf-8` olur),
  # bu yüzden `PYTHONIOENCODING`'den geniştir. İş düzeyinde durur çünkü
  # `unittest` koşumu da Türkçe docstring yazar -- betik içi bir düzeltme o
  # adımı kapsayamazdı. Doğrulama: `PYTHONIOENCODING=cp1252` ile aynı komutlar
  # Linux'ta da patlar (16 test hatası).
  PYTHONUTF8: 1

# ---------------------------------------------------------------------------
# Zaman sinirlari (2026-09-23). Her is `timeout-minutes`
# tasir. Sinir yoksa GitHub'in 360 dk varsayilani gecerlidir: asilan bir test
# uygulamasi iki runner'i alti saat yakar ve log hangi uygulamanin asildigini
# soylemez. Bir kapi, siniri olmayan her isi kirmizi sayar.
#
# Kural: sinir = olculen en uzun surenin ~2 kati, 5 dk'ya yukari yuvarlanir.
# Bir dakikanin altindaki islerde taban 10 dk'dir: kurulum adimlarinin ag
# gecikmesi yanlis bir kirmizi uretmesin. Olcum: GitHub Actions API, 16 kosum
# (2026-09-06..21), is ve adim sureleri.
# Bir is sinirinin yarisini
# gecerse once yeniden olc, sonra yukselt. `--max-parallel-test-modules 1` yalniz
# kultur isinin `--solution` kosumu icindir (moduller seri kosar); diger her test
# isi `--project` ile tek modul kosar ve o bayragi tasimaz.
#
# Adim siniri yalniz kapasite adimindadir. Her test modulu ayri bir adimdir; bir
# modul takilirsa is siniri isi keser ve log takilan adimin adini soyler. Adim
# siniri yalniz o adimi kirar; sonraki `if: always()` yukleme adimlari yine kosar
# ve biten test uygulamalarinin TRX'i artifact'ta kalir. Is siniri ise isin
# tamamini iptal eder.
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------------------
  # Kesilmis zincir
  #
  # `build` derler, paketler ve derlenen cikti agacini TEK bir tar dosyasina
  # koyar (`bin-<os>`). Her test isi `needs: build` ile AYNI kosumun bu tar'ini
  # indirir, acar ve modullerini onunla kosar; hicbiri derlemez ya da
  # paketlemez. Bir `v*` etiketinin ittigi dosyalar ile testlerin kostugu
  # ikililer boylece tek derlemeden gelir. `publish` her test isine baglidir:
  # kirmizi bir modul, hangi isin icinde olursa olsun, yayini durdurur.
  #
  # Neden tar: `upload-artifact` dizini zip'ler ve calistirma bitini kaybeder;
  # test ikilileri (apphost, WorkerHarness) calistirilabilir olmalidir. Tar
  # onceden sikistirilir, bu yuzden yukleme `compression-level: 0` ile yapilir.
  #
  # Neden her test isinde `dotnet restore`: `dotnet test --no-build` proje
  # degerlendirmesi icin `project.assets.json` ister. Tar yalniz `artifacts/bin`
  # tasir; geri yukleme NuGet onbelleginden saniyeler surer ve derleme ara
  # ciktilarini (obj) tasimaktan ucuz ve guvenlidir.
  #
  # Is sirasi bir kuyruk ipucudur: uzun isler dosyada onde durur. Esamanli is
  # siniri asilirsa GitHub hangi isi once baslatacagina kendisi karar verir.
  # ---------------------------------------------------------------------------
  build:
    name: Derle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # CI yalniz kanonik repo'da kosar. Kod ayni dal ve etiketlerle ikinci bir
    # uzaga da itilir (ikinci bir uzak); orada hicbir is
    # kosmaz. Kosul YALNIZ burada durur: diger her is `needs` ile `build`'e
    # (dogrudan veya zincirle) baglidir ve atlanan bir bagimlilik onlari da
    # atlar. `release-dryrun` zaten `if:` tasiyamaz. `needs: build`
    # tasimayan yeni bir is eklenirse ayni kosulu kendisi tasir. Izin
    # listesidir: fork'lar da kosmaz. Repo tasinirsa bu satir guncellenir.
    if: github.repository == 'farukatasoy/Tracon'
    # Testler artik burada kosmaz. Tahmin: ubuntu ~9 dk, windows ~12 dk; ilk
    # kosumlardan sonra olculenin ~2 kati ile guncellenir.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # MinVer surumu git etiketlerinden uretir; tum gecmis gerekir.
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Arayuz derlemesi icin. jsdom 30 Node ^22.22.2 (veya ^24.15, >=26) ister.
      # npm onbellegi package-lock.json uzerinden anahtarlanir.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      # For the gate scripts under `scripts/`. `python3` is not guaranteed on a
      # Windows runner (only `python`); installing it explicitly gives the same
      # binary on both systems. The scripts need nothing beyond the standard
      # library, and the `X | None` union type needs Python 3.10 or later.
      - name: Python kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Tek OS yeterli; bu bir dosya sistemi kontroludur.
      - name: Gelistirme dongusu taramasi
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/kapi.py tarama

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Bagimliliklari geri yukle
        run: dotnet restore Tracon.slnx

      # Agent haritasi (buildTransitive/Tracon.AgentMap.md) capabilities.md'den
      # URETILIR ama COMMIT edilir: `dotnet pack` onu okur, bu yuzden Node zinciri
      # `dotnet build`e baglanmaz. Bedeli sudur - kaynak degisip uretec kosulmazsa
      # dort kapinin dordu de yesil kalir ve nupkg BAYAT harita sevk eder. Bu adim
      # o bosluktur; hicbir npm bagimliligi istemez.
      #
      # `reference/changelog.md` ve surum basina sayfalar (`reference/releases/`)
      #.gitignore'dadir (CHANGELOG.md'den uretilir, kaynagiyla iki kopya
      # olmasin diye) ama build-agent-map.mjs onlari hala `reference/` dizininden
      # okur - llmsBudgetBytes yorumu bu sayfanin llms.txt'ten DUSURULEMEYECEGINI
      # acikca soyler. Taze bir checkout'ta dosya
      # yokken --check calisirsa harita bu sayfayi dislar ve COMMIT edilmis
      # (sayfayi iceren) surumle sonsuza dek uyusmaz; build-changelog.mjs de npm
      # bagimliligi istemedigi icin buraya eklemek yukaridaki yorumu bozmaz.
      - name: Agent haritasi kaynagiyla ayni mi
        run: |
          node docs-site/scripts/build-changelog.mjs
          node docs-site/scripts/build-agent-map.mjs --check

      # Icerik ve sunum kapilari. `pages` isi PULL REQUEST'te kosmaz, bu yuzden bu
      # adim ORADA degil BURADA durur - yoksa kapinin kirmizi olmasi hicbir PR'i
      # durdurmaz. Betik yalnizca node: yerlesikleri ve yerel dosyalar okur; olculdu:
      # node_modules silinmisken de kosuyor, bu yuzden `npm ci` istemez.
      - name: Icerik ve sunum kapilari
        working-directory: docs-site
        run: node scripts/check-content.mjs

      # Not on the `site` job: that job runs on pushes to main only, so a gate
      # placed there would stop no pull request.
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p "*_test.py" -v

      # @tracon/client'in kendi kapisi:
      # schema-drift + paths-coverage + error-mapping + prefix +
      # client testleri. `npm test`'e baglidir, `dotnet test`'e degil -- dort
      # kapinin suresi uretec/paket surumune baglanmaz.
      - name: TypeScript istemcisi bagimliliklari
        working-directory: packages/tracon-client
        run: npm ci

      - name: TypeScript istemcisi testleri
        working-directory: packages/tracon-client
        run: npm test

      - name: Derle
        run: dotnet build Tracon.slnx -c Release --no-restore

      # ---------------------------------------------------------------------
      # Tek derleme zinciri. Bir `v*` etiketinin nuget.org'a ittigi
      # dosyalar BU adimin urettigi dosyalardir: derleme `--no-build` ile
      # paketlenir, test isleri ayni derlemenin tar'ini kosar, `release-dryrun`
      # paketleri paketlemeden dogrular, `publish` ayni baytlari iter.
      #
      # 🚨 Sira bir sozlesmedir: bu adim `Derle`'nin HEMEN ardindadir.
      # Performans kapisi, kapasite smoke'u ve Tracon.Package.Tests'in
      # fiksturleri src'yi yeniden derler (ReleaseArtifactFixture baska bir
      # surumle; olculdu 2026-09-24: Tracon.Core.dll SHA-256'si degisti). Artik
      # hicbiri bu isin calisma alaninda kosmaz; sira yine de korunur, cunku
      # araya giren bir adim derlemeyi yeniden damgalayabilir. Yalniz ubuntu
      # bacagi paketler; Windows platform farkini olcer.
      #
      # Taban dogrulamasi pack aninin isidir: son `v*` etiketinin
      # paketleri izole bir cache'e nuget.org'dan restore edilir. Ag gerekir.
      # ---------------------------------------------------------------------
      - name: Paketle
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/kapi.py paketle --cikti artifacts/ci-paket

      # Kume `Paketle` aninda manifest SHA-256'lariyla dondu. Bu adim kumenin
      # paketleme ile yukleme arasinda degismedigini yuklemeden hemen once
      # kanitlar. Testler bu isin calisma alaninda kosmaz; yukleme, kirmizi bir
      # test isinden once olur ama etiket yolunda kimseyi korumasiz birakmaz:
      # `publish` her test isine, `release-dryrun` PR'de kosan her test isine
      # baglidir ve `nuget-verified` yalniz onlar yesilken yuklenir.
      - name: Paketleri dogrula
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/kapi.py paket-dogrula artifacts/ci-paket

      - name: Paketleri yukle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts/ci-paket/*.nupkg
            artifacts/ci-paket/*.snupkg
            artifacts/ci-paket/package-manifest.json
            artifacts/ci-paket/api-compat/*.xml
          if-no-files-found: error

      # Test islerinin kosacagi ikililer. `artifacts/bin` her projenin kendi
      # cikti dizinini tasir (testler, ornekler, WorkerHarness, E2E'nin
      # playwright.ps1'i); `obj` tasinmaz. Tar, calistirma bitini korur. Sikistirma
      # bir boru hattidir (`gzip -1`): GNU ve bsd tar'in ikisinde de ayni calisir.
      # Boyut ozete yazilir; sure adimin kendi suresinden okunur.
      - name: Derleme ciktilarini tar'la
        shell: bash
        run: |
          mkdir -p artifacts/ci-bin
          tar -cf - artifacts/bin | gzip -1 > artifacts/ci-bin/bin.tar.gz
          ls -l artifacts/ci-bin/bin.tar.gz
          {
            echo "### bin-${{ matrix.os }}"
            echo "tar boyutu: $(du -h artifacts/ci-bin/bin.tar.gz | cut -f1); acilmis boyut: $(du -sh artifacts/bin | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Derleme ciktilarini yukle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.os }}
          path: artifacts/ci-bin/bin.tar.gz
          # Tar zaten sikistirilmis; ikinci bir zip yalniz sure harcar.
          compression-level: 0
          # Yalniz bu kosumun test isleri okur.
          retention-days: 1
          if-no-files-found: error
          # `overwrite` BILINCLI olarak yok. Bu isi yeniden kosmak ayni adla ikinci
          # bir yukleme dener ve 409 ile kirilir: onceki test islerinin kosmus oldugu
          # tar'in baytlari sessizce degistirilemez. Yeni bir derleme icin tum kosum
          # bastan baslatilir. Ayni kural `nuget-packages` yuklemesi icin de gecerlidir.

  # ---------------------------------------------------------------------------
  # Kultur ve saat dilimi: .NET `LC_ALL` ve `TZ`'yi Linux'ta okur, yerel ayarin
  # kurulu olmasini istemez. Yerelde olculen komut aynidir: tam cozumde iki bacak
  # 16 275 testle yesildi. Burada Docker istemeyen projeler kosar (Windows
  # bacaklariyla ayni solution filter); veritabani bacaklarinin kendi yerel ayari
  # asagidaki matris islerindedir.
  #
  # Kosul `build` ile ayni zincir: her bacak `needs: build` tasir. PR'de kosmaz
  # (her PR on bacak yakmasin); `main`, etiket ve elle tetiklemede kosar. En
  # uzun is budur (modullerin tamami tek isin icinde, bir modul bir anda), bu
  # yuzden dosyada onde durur.
  # ---------------------------------------------------------------------------
  culture-matrix:
    name: Kultur (${{ matrix.name }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Tahmin: ~19 dk (kurulum 3 + moduller 15,8). Ilk kosumdan sonra olculenin
    # ~2 kati ile guncellenir; onceki degeri derleme dahil 30,9 dk idi.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tr-TR, America/New_York
            lc_all: tr_TR.UTF-8
            tz: America/New_York
          - name: de-DE, Australia/Lord_Howe
            lc_all: de_DE.UTF-8
            tz: Australia/Lord_Howe
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Tracon.Package.Tests kendi pack'ini kosar ve arayuz zinciri (npm) o pack'te
      # soguk baslar.
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derleme ciktilarini indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Derleme ciktilarini ac
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Bagimliliklari geri yukle
        id: restore
        run: dotnet restore Tracon.slnx

      - name: Playwright tarayicisini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0

      - name: Playwright sistem bagimliliklari
        run: |
          pwsh artifacts/bin/Tracon.Ui.E2ETests/release/playwright.ps1 install --with-deps chromium

      # Degiskenler yalniz test surecine verilir: kurulu olmayan bir yerel ayar
      # restore ve apt adimlarina uyari bastirmasin.
      - name: Test et (Docker gerektirmeyenler)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          LC_ALL: ${{ matrix.lc_all }}
          TZ: ${{ matrix.tz }}
        run: dotnet test --solution Tracon.no-docker.slnf -c Release --no-build --max-parallel-test-modules 1 --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-culture-${{ strategy.job-index }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

  # ---------------------------------------------------------------------------
  # Ubuntu test isleri (her biri bir sepet; sepet icinde bir modul bir anda)
  #
  # Ortak adimlar her isin basinda tekrarlanir (checkout, SDK, onbellek, tar,
  # geri yukleme); bir moduldeki kirmizi sonraki modulleri DURDURMAZ: her test
  # adimi `!cancelled()` ile kosar ve is yine de kirmizi biter. Bir test adimi
  # yalniz geri yukleme basarisizsa atlanir.
  #
  # Tum solution'u kosan eski adimin yerine her test projesi AYRI bir adimdir.
  # Yeni bir test projesi eklenirse buraya bir adim eklenmelidir; kapi testi
  # (kapi_test.py) her test projesinin tam bir ubuntu ve (Docker'siz ise) tam bir
  # windows isinde kostugunu denetler.
  #
  # Sinirlar: sinir = tahmin edilen surenin ~2 kati, 5 dk'ya yukari yuvarlanir
  # (taban 10 dk). Tahminler eski seri kosumun modul sureleridir (ubuntu:
  # TwoNode 460 sn, SqlServer 361, Package 278, AspNetCore 154, PostgreSql 150,
  # Sqlite 91, Workflows 65, Core 64, E2E 56, Generators 40) ve ilk kosumdan
  # sonra olculenle degistirilir.
  # ---------------------------------------------------------------------------
  test-twonode:
    name: Test (TwoNode)
    needs: build
    runs-on: ubuntu-latest
    # Tahmin ~10,5 dk (kurulum 2,7 + modul 7,7).
    timeout-minutes: 25
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derleme ciktilarini indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Derleme ciktilarini ac
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Bagimliliklari geri yukle
        id: restore
        run: dotnet restore Tracon.slnx

      # Yerel kosum SQL Server'da workflow iptal taramasinin yarisini kosar;
      # CI iki saglayicida da tam matrisi kosar. Degisken yalniz bu modul tarafindan
      # okunur.
      - name: Test et (Tracon.TwoNode.IntegrationTests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          TRACON_TEST_FULL_SWEEP: '1'
        run: dotnet test --project tests/Tracon.TwoNode.IntegrationTests/Tracon.TwoNode.IntegrationTests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-twonode
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          overwrite: true

  test-package:
    name: Test (Package, E2E)
    needs: build
    runs-on: ubuntu-latest
    # Tahmin ~10,5 dk (kurulum 3 + Package 6,1 + E2E 0,9). Package'in fiksturleri
    # kendi pack'ini kosar; arayuz zinciri (npm) o pack'te soguk baslar.
    timeout-minutes: 25
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: .NET SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Tracon.UI/frontend/package-lock.json
            packages/tracon-client/package-lock.json

      - name: NuGet paketlerini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derleme ciktilarini indir
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-ubuntu-latest
          path: artifacts/ci-bin

      - name: Derleme ciktilarini ac
        shell: bash
        run: tar -xzf artifacts/ci-bin/bin.tar.gz

      - name: Bagimliliklari geri yukle
        id: restore
        run: dotnet restore Tracon.slnx

      # Playwright'in tarayici ikilileri NuGet paketiyle gelmez. Test fixture'i
      # eksikse indirir, ancak Linux'ta sistem bagimliliklari ayri bir adim ister
      # ve o adim sudo gerektirir. Onbellek isabetinde indirme atlanir.
      - name: Playwright tarayicisini onbellekle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0

      - name: Playwright sistem bagimliliklari
        run: |
          pwsh artifacts/bin/Tracon.Ui.E2ETests/release/playwright.ps1 install --with-deps chromium

      - name: Test et (Tracon.Package.Tests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.Package.Tests/Tracon.Package.Tests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test et (Tracon.Ui.E2ETests)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test --project tests/Tracon.Ui.E2ETests/Tracon.Ui.E2ETests.csproj -c Release --no-build --report-trx --results-directory artifacts/test-results --results-directory-layout per-module

      - name: Test sonuclarini yukle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-package
          path: artifacts/test-results/**/*.trx
