name: Documentation defect
description: Something on tracon.dev, in a package README, or in XML documentation is wrong or missing.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page URL, the package README, or the type and member whose XML documentation is wrong.
      placeholder: https://tracon.dev/reference/versioning/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What it says, and what is actually true
      description: Documentation that promises more than the runtime delivers is treated as a defect in the runtime contract.
    validations:
      required: true
