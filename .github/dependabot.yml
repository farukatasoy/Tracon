# Bagimlilik suruklenmesi kapisi.
#
# NEDEN VAR: 2026-08-21 kesif turu olctu ki bu repo'da surumlerin bayatladigini
# fark eden HICBIR mekanizma yoktu; MAF 1.16 -> 1.18, MEAI 10.8.3 -> 10.9.0 ve
# MCP 2.0.0 -> 2.2.0 sapmalari ancak elle bir olcumle gorundu.
#
# Surumler yalnizca Directory.Packages.props icinde yasar (Central Package
# Management); Dependabot NuGet guncellemelerini oraya yazar.
#
# Asagidaki `ignore` kalemleri KEYFI DEGILDIR. NuGet kalemlerinin gerekcesi
# Directory.Packages.props icinde, npm kalemlerinin gerekcesi kalemin hemen ustundeki
# yorumda yazilidir. Bir kalemi buradan cikarmadan once ilgili yorumu ve karari
# (docs/KARARLAR.md) oku.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # 1. NuGet — tum .NET paketleri (Directory.Packages.props)
  # ---------------------------------------------------------------------------
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 🚨 Calisma ani yigini TEK grupta yukselir (Faz 214, A-62). Zincir: MAF belli
      # bir MEAI ister, MEAI belli bir Microsoft.Extensions.* / System.Text.Json
      # alt siniri ve belli bir OpenAI ister, MAF Hosting belli bir A2A ister.
      # Bu uc hat ayri PR'lara bolunurse her PR `restore`'da NU1605/NU1107 ile
      # kirmizi kalir ve hicbiri birlestirilemez: PR #20...#37 boyle, besi hafta
      # birlestirilmeden kapandi. MAF'in GA, preview ve alpha katmanlari da ayni
      # hatta ilerler (K-008, K-872).
      agent-stack:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.*"
          - "OpenAI"
          - "A2A*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Bcl.*"
          - "Microsoft.Data.*"
      # `.Core` (istemci) ve `.AspNetCore` (sunucu) birlikte hareket eder (K-334).
      model-context-protocol:
        patterns:
          - "ModelContextProtocol*"
      test-tooling:
        patterns:
          - "xunit*"
          - "NSubstitute"
          - "Shouldly"
          - "Testcontainers*"
          - "Microsoft.Playwright"
          - "Microsoft.Testing.*"
      analyzers:
        patterns:
          - "Meziantou.Analyzer"
          - "Microsoft.CodeAnalysis.*Analyzers"
          - "MinVer"
    ignore:
      # Kaynak ureteci, kendisini yukleyen derleyicinin Roslyn'inden YENI olamaz
      # (K-349). Tracon net8.0'i da hedefler (K-005) ve .NET 8 SDK GA Roslyn
      # 4.8.0 tasir; daha yenisi eski SDK'da SESSIZCE yuklenmez. Olculdu
      # (2026-10-16): SDK 10.0.100 -> 5.0.0 · 10.0.402 -> 5.9.0 · 9.0.306 -> 4.14.0.
      # Faz 193 net8/net9'u dusurunce (K-855) taban 5.0.0 olur, 5.9.0 DEGIL
      # (en eski desteklenen SDK'nin Roslyn'i, F-569) - bu satir o zaman kalkar.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: ["> 4.8.0"]
      # Sevk edilen `Tracon.Testing.Contracts.Xunit` paketinin xunit alt siniri
      # (Faz 215, A-70). Reponun kendi testleri xunit.v3 4.x'te kosar; bu iki alt
      # paket nuspec'te `>= 3.2.2` olarak sevk edilir ki xunit.v3 3.x'teki tuketici
      # NU1608 almasin. 4.x'e yukseltmek bir bagimlilik guncellemesi degil,
      # TUKETICIYI xunit.v3 4'e zorlayan bir uyumluluk karari (K-1018).
      - dependency-name: "xunit.v3.extensibility.core"
        versions: [">= 4.0.0"]
      - dependency-name: "xunit.v3.assert"
        versions: [">= 4.0.0"]

  # ---------------------------------------------------------------------------
  # 2. npm — arayuz (bundle butcesi 250 KB gzip; kapi dotnet build icindedir)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/src/Tracon.UI/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # 3. npm — dokuman sitesi (docs-site/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-site:
        patterns:
          - "*"
    ignore:
      # `astro-mermaid` 2.1.0 (en yenisi) mermaid'i `^10 || ^11` ile sinirlar
      # (Faz 216). mermaid 12 ile `npm ci` ERESOLVE ile duser (CI kirilir);
      # `overrides` kurulumu gecirir ama 1,46 MB elkjs parcasi ekler ve hicbir
      # diyagram ELK kullanmaz. `astro-mermaid` 12'yi destekleyince bu satir kalkar.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # 4. npm — @tracon/client (packages/tracon-client/)
  #
  # 🚨 Bu, SEVK EDILEN npm paketidir ve kendi package-lock.json'u vardir. Uc
  # ekosistemin hicbiri onu gormuyordu: NuGet Audit yalniz .NET restore
  # grafigini tarar, diger iki npm blogu baska dizinleri isaret eder ve CI
  # hicbir yerde `npm audit` kosmaz. Yani yayinlanan paketin kendi agacindaki
  # bir advisory'yi fark edecek HICBIR mekanizma yoktu (yayin oncesi denetim,
  # 2026-09-19). Ayni turda olculdu: agacta `js-yaml` high ve `vitest`
  # moderate advisory'leri vardi; ucu de devDependency oldugu icin sevk edilen
  # `dist/` temizdi — ama bunu bir kapi degil, elle bir olcum gosterdi.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/packages/tracon-client"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      tracon-client:
        patterns:
          - "*"
    ignore:
      # TypeScript 7'nin `typescript` paketi derleyici API'si tasimaz; istemcinin
      # `npm run generate` adimi ve `schema-drift.test.ts` onu cagiran
      # `openapi-typescript` 7.x'e (eş bagimlilik `typescript ^5`) baglidir
      # (Faz 216). `openapi-typescript` TypeScript 7'yi destekleyince bu
      # satir kalkar. Arayuz (frontend/) TypeScript 7'dedir.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # 5. GitHub Actions — ci.yml'deki action surumleri
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
